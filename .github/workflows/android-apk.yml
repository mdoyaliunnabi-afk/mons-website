name: Build MONS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'mons-logo.svg'
      - 'manifest.webmanifest'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Install Capacitor
        working-directory: mobile-app
        run: npm install

      - name: Add Android project
        working-directory: mobile-app
        run: npx cap add android

      - name: Sync web app
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONS-Android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        run: cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk MONS.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MONS.apk --title "MONS Android App $TAG" --notes "MONS Android app APK build."
