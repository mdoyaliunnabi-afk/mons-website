name: Fix MONS social icons

on:
  push:
    paths:
      - '.github/workflows/fix-social-icons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix social section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''.social-links a{min-width:150px;padding:13px 18px;border:1px solid #e8eaf0;border-radius:14px;background:#fff;font-weight:900;box-shadow:0 8px 22px #1118270b;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .18s,box-shadow .18s}.social-links a:hover{transform:translateY(-2px);box-shadow:0 12px 28px #11182718}.social-icon{width:28px;height:28px;display:block;flex:0 0 28px}.wa{color:#18a957}.ig{color:#d62976}.tt{color:#111}.fb{color:#1877f2}'''
          if css not in s:
              s = s.replace('</style>', css + '</style>', 1)
          new = '''<section class="social"><div class="social-in"><h2>Contact MONS</h2><p class="sub">Connect with MONS on social media or WhatsApp.</p><div class="social-links"><a class="wa" href="https://wa.me/971527464292" target="_blank" rel="noopener"><svg class="social-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="currentColor"/><path fill="#fff" d="M23.2 8.8A10.1 10.1 0 0 0 7.3 21.1L6 26l5-1.3a10.1 10.1 0 0 0 12.2-15.9Zm-7.1 15.1c-1.6 0-3.2-.4-4.6-1.2l-.3-.2-3 .8.8-2.9-.2-.3a8.2 8.2 0 1 1 7.3 3.8Zm4.5-6.1c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.2-.1-.9-.3-1.8-1.1-.7-.6-1.1-1.3-1.2-1.5-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.6.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.5-.3Z"/></svg> WhatsApp</a><a class="ig" href="#" onclick="alert('Instagram link will be added later');return false"><svg class="social-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="currentColor"/><rect x="9" y="9" width="14" height="14" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="22.5" cy="9.8" r="1.4" fill="#fff"/></svg> Instagram</a><a class="tt" href="#" onclick="alert('TikTok link will be added later');return false"><svg class="social-icon" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path fill="#fff" d="M20 7v11.3a5.6 5.6 0 1 1-4-5.4v3.4a2.5 2.5 0 1 0 1 2V7h3Z"/><path fill="#25F4EE" d="M20 7c.5 2.3 1.7 3.8 4 4.4v2.6c-1.6-.2-2.9-.8-4-1.8V7Z"/></svg> TikTok</a><a class="fb" href="#" onclick="alert('Facebook link will be added later');return false"><svg class="social-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="currentColor"/><path fill="#fff" d="M18.1 27V17.8h3.1l.5-3.6h-3.6v-2.3c0-1 .3-1.7 1.8-1.7h1.9V7c-.3 0-1.4-.1-2.7-.1-2.7 0-4.5 1.6-4.5 4.5v2.8h-3v3.6h3V27h3.5Z"/></svg> Facebook</a></div></div></section>'''
          s2, n = re.subn(r'<section class="social">.*?</section>', new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('social section not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-social-icons.yml
          git commit -m "Fix MONS social icons and WhatsApp contact" --allow-empty
          git rm .github/workflows/fix-social-icons.yml
          git commit -m "Remove temporary social icon fixer"
          git push
