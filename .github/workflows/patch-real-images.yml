name: MONS real product images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != '[MONS] Add real product images' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image styling and script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = '.real-pic img{width:100%;height:100%;object-fit:cover;display:block}.real-pic{background:#f4f5f8}.real-pic img:hover{transform:scale(1.03);transition:.25s}'
          if '.real-pic img' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          if 'src="real-images.js"' not in s:
              s = s.replace('</body>', '<script src="real-images.js"></script></body>', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '[MONS] Add real product images' || exit 0
          git push
