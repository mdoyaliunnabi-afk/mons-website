<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Admin Panel</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:30px;font-weight:900;font-style:italic}.muted{color:#667085}.card{background:white;border-radius:18px;padding:20px;margin-top:20px;box-shadow:0 8px 30px #0000000b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat b{font-size:30px;display:block;margin-top:8px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#6d4aff;color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0f6;color:#111827}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin:8px 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee;font-size:14px}th{background:#fafafa}.login{max-width:420px;margin:70px auto}.error{color:#b42318;margin-top:10px}.ok{color:#168342}@media(max-width:700px){.stats{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head>
<body><main class="wrap"><div id="loginView" class="card login"><div class="brand">MONS</div><p class="muted">Secure Admin Panel</p><label>Email</label><input id="email" type="email" placeholder="Admin email"><label>Password</label><input id="password" type="password" placeholder="Your password"><button class="btn" id="loginBtn">Admin Login</button><div id="loginMsg" class="error"></div><p><a href="index.html">← Back to MONS Store</a></p></div><div id="adminView" style="display:none"><div class="top"><div><div class="brand">MONS Admin</div><div class="muted">Store control center</div></div><button class="btn secondary" id="logoutBtn">Logout</button></div><div class="stats"><div class="card stat"><span class="muted">Customers</span><b id="count">0</b></div><div class="card stat"><span class="muted">Store</span><b>MONS</b></div><div class="card stat"><span class="muted">Status</span><b class="ok">Online</b></div></div><div class="card"><div class="top"><h2>Customers</h2><button class="btn" id="refreshBtn">Refresh</button></div><div id="tableWrap" class="muted">Loading...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=window.supabase.createClient(window.MONS_SUPABASE_URL,window.MONS_SUPABASE_KEY);const $=id=>document.getElementById(id);async function isAdmin(){const{data,error}=await sb.from('admins').select('id').limit(1);return !error&&data&&data.length>0}async function load(){const ok=await isAdmin();if(!ok){$('adminView').style.display='none';$('loginView').style.display='block';return}$('loginView').style.display='none';$('adminView').style.display='block';const{data,error}=await sb.from('profiles').select('id,full_name,mobile,apartment,building,street,area,details,created_at').order('created_at',{ascending:false});if(error){$('tableWrap').innerHTML='<div class="error">Unable to load customers.</div>';return}$('count').textContent=data.length;if(!data.length){$('tableWrap').innerHTML='No customers yet.';return}let h='<table><thead><tr><th>Name</th><th>Mobile</th><th>Location</th><th>Registered</th></tr></thead><tbody>';for(const c of data){const loc=[c.apartment,c.building,c.street,c.area].filter(Boolean).join(', ');h+=`<tr><td>${esc(c.full_name||'—')}</td><td>${esc(c.mobile||'—')}</td><td>${esc(loc||'—')}</td><td>${new Date(c.created_at).toLocaleDateString()}</td></tr>`}h+='</tbody></table>';$('tableWrap').innerHTML=h}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}await load();};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=load;sb.auth.onAuthStateChange(()=>load());load();</script></body></html>
