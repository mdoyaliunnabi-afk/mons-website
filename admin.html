<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Admin</title><style>body{margin:0;font-family:Arial;background:#f6f7fb;color:#17122f}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900;font-style:italic}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #0000000b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:25px;margin-top:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;background:#6c4cff;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eeeef5;color:#17122f}.red{background:#d92d20}.panel{display:none}.panel.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:700;font-size:13px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 10px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:#667085}.ok{color:#168342}.err{color:#b42318}.thumb{width:55px;height:55px;object-fit:contain;border-radius:9px;background:#f2f4f7}.row{display:flex;align-items:center;gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.login{max-width:400px;margin:60px auto}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.wrap{padding:10px}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="wrap"><div id="login" class="card login"><div class="brand">MONS</div><p class="muted">Admin Control</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" id="loginBtn">Login</button><p id="loginMsg" class="err"></p><a href="index.html">← Store</a></div><div id="app" style="display:none"><div class="top"><div><div class="brand">MONS Admin</div><div class="muted">Products • Website • Orders • Customers</div></div><div class="actions"><a class="btn secondary" href="index.html">View Store</a><button class="btn secondary" id="logout">Logout</button></div></div><div class="grid"><div class="card stat">Products<b id="pc">0</b></div><div class="card stat">Customers<b id="cc">0</b></div><div class="card stat">Orders<b id="oc">0</b></div><div class="card stat">Store<b class="ok">Online</b></div></div><div class="card"><div class="tabs"><button class="btn" data-tab="products">Products</button><button class="btn secondary" data-tab="website">Website Control</button><button class="btn secondary" data-tab="orders">Orders</button><button class="btn secondary" data-tab="customers">Customers</button></div></div><section id="products" class="panel active"><div class="card"><div class="top"><h2>Products</h2><button class="btn" id="add">+ Add Product</button></div><div id="editor" style="display:none"><div class="form"><input id="pid" type="hidden"><div><label>Name</label><input id="name"></div><div><label>Price AED</label><input id="price" type="number" step="0.01"></div><div><label>Category</label><input id="cat"></div><div><label>Brand</label><input id="brand"></div><div><label>Image URL</label><input id="image"></div><div><label>Stock</label><input id="stock" value="In Stock"></div><div class="full"><label>Description</label><textarea id="desc"></textarea></div></div><div class="actions"><button class="btn" id="save">Save</button><button class="btn secondary" id="cancel">Cancel</button></div><p id="pmsg"></p></div><div id="plist">Loading...</div></div></section><section id="website" class="panel"><div class="card"><h2>Website Control</h2><div class="form"><div><label>Store Name</label><input id="sname"></div><div><label>Tagline</label><input id="stag"></div><div class="full"><label>Description</label><textarea id="sdesc"></textarea></div><div class="full"><label>Announcement / Banner</label><input id="sbanner"></div></div><button class="btn" id="saveSite">Save Website</button><p id="smsg"></p></div></section><section id="orders" class="panel"><div class="card"><h2>Orders</h2><div id="olist">Loading...</div></div></section><section id="customers" class="panel"><div class="card"><h2>Customers</h2><div id="clist">Loading...</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(MONS_SUPABASE_URL,MONS_SUPABASE_KEY),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let products=[];async function admin(){const{data:u}=await db.auth.getUser();if(!u?.user)return false;const{data}=await db.from('admins').select('id').eq('id',u.user.id).maybeSingle();return!!data}async function start(){if(!(await admin()))return;$('login').style.display='none';$('app').style.display='block';await Promise.all([loadProducts(),loadSite(),loadOrders(),loadCustomers()])}async function loadProducts(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('plist').innerHTML='<span class="err">'+esc(r.error.message)+'</span>';return}products=r.data||[];$('pc').textContent=products.length;$('plist').innerHTML=products.length?'<table><tr><th>Product</th><th>Category</th><th>Price</th><th>Action</th></tr>'+products.map(p=>`<tr><td><div class="row"><img class="thumb" src="${esc(p.image||'')}" onerror="this.style.visibility='hidden'"><b>${esc(p.name)}</b></div></td><td>${esc(p.category)}</td><td>AED ${Number(p.price||0).toFixed(2)}</td><td><button class="btn" onclick="edit('${p.id}')">Edit</button> <button class="btn red" onclick="del('${p.id}')">Delete</button></td></tr>`).join('')+'</table>':'No products yet.'}function openEditor(p){$('editor').style.display='block';$('pid').value=p?.id||'';$('name').value=p?.name||'';$('price').value=p?.price??'';$('cat').value=p?.category||'';$('brand').value=p?.brand||'';$('image').value=p?.image||'';$('stock').value=p?.stock||'In Stock';$('desc').value=p?.description||''}window.edit=id=>openEditor(products.find(p=>String(p.id)===String(id)));window.del=async id=>{if(confirm('Delete product?')){const r=await db.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else loadProducts()}};$('add').onclick=()=>openEditor();$('cancel').onclick=()=>{$('editor').style.display='none'};$('save').onclick=async()=>{const id=$('pid').value,row={name:$('name').value.trim(),price:Number($('price').value||0),category:$('cat').value.trim(),brand:$('brand').value.trim(),image:$('image').value.trim(),stock:$('stock').value.trim(),description:$('desc').value.trim(),active:true};const r=id?await db.from('products').update(row).eq('id',id):await db.from('products').insert(row);if(r.error){$('pmsg').innerHTML='<span class="err">'+esc(r.error.message)+'</span>';return}$('editor').style.display='none';loadProducts()};async function loadSite(){const{data,error}=await db.from('site_settings').select('*');if(error)return;const m=Object.fromEntries((data||[]).map(x=>[x.key,x.value]));$('sname').value=m.store_name||'MONS';$('stag').value=m.tagline||'Shop Smart.';$('sdesc').value=m.description||'Discover useful products, modern essentials and great-value finds - made simple for online shoppers in the UAE.';$('sbanner').value=m.banner||''}async function saveSetting(key,value){const r=await db.from('site_settings').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'});return r.error} $('saveSite').onclick=async()=>{for(const [k,v] of [['store_name',$('sname').value],['tagline',$('stag').value],['description',$('sdesc').value],['banner',$('sbanner').value]]){const e=await saveSetting(k,v);if(e){$('smsg').innerHTML='<span class="err">'+esc(e.message)+'</span>';return}}$('smsg').innerHTML='<span class="ok">Saved successfully.</span>'};async function loadOrders(){const{data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('olist').innerHTML=esc(error.message);return}$('oc').textContent=data?.length||0;$('olist').innerHTML=data?.length?'<table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+data.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.customer_name)}</td><td>AED ${Number(o.total||0).toFixed(2)}</td><td><select onchange="status('${o.id}',this.value)"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td></tr>`).join('')+'</table>':'No orders yet.'}window.status=async(id,v)=>{const r=await db.from('orders').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message)};async function loadCustomers(){const{data,error}=await db.from('profiles').select('id,full_name,mobile,area,created_at').order('created_at',{ascending:false});if(error){$('clist').innerHTML=esc(error.message);return}$('cc').textContent=data?.length||0;$('clist').innerHTML=data?.length?'<table><tr><th>Name</th><th>Mobile</th><th>Area</th></tr>'+data.map(c=>`<tr><td>${esc(c.full_name||'—')}</td><td>${esc(c.mobile||'—')}</td><td>${esc(c.area||'—')}</td></tr>`).join('')+'</table>':'No customers yet.'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active')});$('loginBtn').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}start()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};start();</script></body></html>
