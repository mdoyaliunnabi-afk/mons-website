<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Admin Control</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900;font-style:italic}.muted{color:#667085}.card{background:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #0000000b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat b{font-size:26px;display:block;margin-top:7px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#6d4aff;color:#fff;font-weight:800;cursor:pointer}.btn.red{background:#d92d20}.btn.secondary{background:#eef0f6;color:#111827}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-weight:700;font-size:13px}input,textarea,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box;margin:7px 0 12px;font:inherit}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px}th{background:#fafafa}.login{max-width:420px;margin:70px auto}.error{color:#b42318}.ok{color:#168342}.notice{padding:12px;border-radius:10px;background:#f2f4f7;margin-top:12px}.productrow{display:flex;align-items:center;gap:12px}.thumb{width:55px;height:55px;border-radius:10px;background:#f2f4f7;display:flex;align-items:center;justify-content:center;font-size:25px}.small{font-size:12px}.hidden{display:none!important}@media(max-width:800px){.grid,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.formgrid{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:15px}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="wrap"><div id="loginView" class="card login"><div class="brand">MONS</div><p class="muted">Secure Admin Control</p><label>Email</label><input id="email" type="email" placeholder="Admin email" autocomplete="username"><label>Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="loginBtn">Admin Login</button><div id="loginMsg" class="error"></div><p><a href="index.html">← Back to MONS Store</a></p></div><div id="adminView" class="hidden"><div class="top"><div><div class="brand">MONS Admin</div><div class="muted">Store control center</div></div><div class="actions"><a class="btn secondary" href="index.html">View Store</a><button class="btn secondary" id="logoutBtn">Logout</button></div></div><div class="grid"><div class="card stat"><span class="muted">Products</span><b id="productCount">0</b></div><div class="card stat"><span class="muted">Customers</span><b id="customerCount">0</b></div><div class="card stat"><span class="muted">Orders</span><b id="orderCount">0</b></div><div class="card stat"><span class="muted">Store</span><b class="ok">Online</b></div></div><div class="card"><div class="tabs"><button class="btn tab active" data-tab="products">Products</button><button class="btn secondary tab" data-tab="website">Website Control</button><button class="btn secondary tab" data-tab="orders">Orders</button><button class="btn secondary tab" data-tab="customers">Customers</button></div></div><section id="products" class="panel active"><div class="card"><div class="top"><h2>Products</h2><button class="btn" id="addProductBtn">+ Add Product</button></div><div id="productEditor" class="notice hidden"><h3 id="editorTitle">Add Product</h3><input id="editId" type="hidden"><div class="formgrid"><div><label>Product Name</label><input id="pName"></div><div><label>Price (AED)</label><input id="pPrice" type="number" step="0.01"></div><div><label>Category</label><input id="pCategory" placeholder="watch, buds, lamp..."></div><div><label>Image URL</label><input id="pImage" placeholder="https://..."></div></div><label>Description</label><textarea id="pDesc"></textarea><div class="actions"><button class="btn" id="saveProductBtn">Save Product</button><button class="btn secondary" id="cancelProductBtn">Cancel</button></div><div id="productMsg"></div></div><div id="productsTable" class="muted">Loading...</div></div></section><section id="website" class="panel"><div class="card"><h2>Website Control</h2><p class="muted">Change the homepage text and store settings from here.</p><label>Store Name</label><input id="siteName"><label>Tagline</label><input id="siteTagline"><label>Hero Description</label><textarea id="siteDescription"></textarea><label>Announcement / Banner</label><input id="siteBanner"><label>Featured Product IDs (comma separated)</label><input id="siteFeatured"><div class="actions"><button class="btn" id="saveSiteBtn">Save Website Settings</button><button class="btn secondary" id="resetSiteBtn">Reload</button></div><div id="siteMsg"></div></div></section><section id="orders" class="panel"><div class="card"><div class="top"><h2>Orders</h2><button class="btn" id="refreshOrders">Refresh</button></div><div id="ordersTable" class="muted">Loading...</div></div></section><section id="customers" class="panel"><div class="card"><div class="top"><h2>Customers</h2><button class="btn" id="refreshCustomers">Refresh</button></div><div id="customersTable" class="muted">Loading...</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=window.supabase.createClient(window.MONS_SUPABASE_URL,window.MONS_SUPABASE_KEY);const $=id=>document.getElementById(id);let products=[];let site={};let loading=false;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function isAdmin(){const{data:u}=await sb.auth.getUser();const id=u?.user?.id;if(!id)return false;const{data}=await sb.from('admins').select('id').eq('id',id).maybeSingle();return !!data}async function loadAll(){if(loading)return;loading=true;try{const ok=await isAdmin();if(!ok){$('loginMsg').textContent='This account is not authorized.';return}$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');await Promise.all([loadProducts(),loadCustomers(),loadOrders(),loadSite()])}finally{loading=false}}async function loadProducts(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){$('productsTable').innerHTML='<div class="error">Products table is not available yet. Create it in Supabase first.</div>';return}products=data||[];$('productCount').textContent=products.length;if(!products.length){$('productsTable').innerHTML='No products yet.';return}let h='<table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody>';for(const p of products)h+=`<tr><td><div class="productrow"><div class="thumb">🛍️</div><div><b>${esc(p.name)}</b><div class="small">ID: ${esc(p.id)}</div></div></div></td><td>${esc(p.category||'—')}</td><td>AED ${Number(p.price||0).toFixed(2)}</td><td><div class="actions"><button class="btn" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="btn red" onclick="deleteProduct('${esc(p.id)}')">Delete</button></div></td></tr>`;h+='</tbody></table>';$('productsTable').innerHTML=h}function openEditor(p){$('productEditor').classList.remove('hidden');$('editId').value=p?.id||'';$('pName').value=p?.name||'';$('pPrice').value=p?.price??'';$('pCategory').value=p?.category||'';$('pImage').value=p?.image_url||p?.image||'';$('pDesc').value=p?.description||'';$('editorTitle').textContent=p?'Edit Product':'Add Product';scrollTo({top:document.querySelector('#productEditor').offsetTop-10,behavior:'smooth'})}window.editProduct=id=>openEditor(products.find(p=>String(p.id)===String(id)));window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error){alert(error.message);return}await loadProducts()};$('addProductBtn').onclick=()=>openEditor();$('cancelProductBtn').onclick=()=>$('productEditor').classList.add('hidden');$('saveProductBtn').onclick=async()=>{const id=$('editId').value;const row={name:$('pName').value.trim(),price:Number($('pPrice').value||0),category:$('pCategory').value.trim(),image_url:$('pImage').value.trim(),description:$('pDesc').value.trim()};if(!row.name){$('productMsg').textContent='Product name is required.';return}let res=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);if(res.error){$('productMsg').innerHTML='<span class="error">'+esc(res.error.message)+'</span>';return}$('productMsg').innerHTML='<span class="ok">Saved successfully.</span>';$('productEditor').classList.add('hidden');await loadProducts()};async function loadSite(){const{data,error}=await sb.from('site_settings').select('*').limit(1).maybeSingle();if(error||!data)return;site=data;$('siteName').value=data.store_name||'MONS';$('siteTagline').value=data.tagline||'';$('siteDescription').value=data.description||'';$('siteBanner').value=data.banner||'';$('siteFeatured').value=Array.isArray(data.featured_products)?data.featured_products.join(','):data.featured_products||''} $('saveSiteBtn').onclick=async()=>{const row={store_name:$('siteName').value.trim(),tagline:$('siteTagline').value.trim(),description:$('siteDescription').value.trim(),banner:$('siteBanner').value.trim(),featured_products:$('siteFeatured').value.split(',').map(x=>x.trim()).filter(Boolean)};const res=site?.id?await sb.from('site_settings').update(row).eq('id',site.id):await sb.from('site_settings').insert(row);if(res.error){$('siteMsg').innerHTML='<span class="error">'+esc(res.error.message)+'</span>';return}$('siteMsg').innerHTML='<span class="ok">Website settings saved.</span>';await loadSite()};async function loadCustomers(){const{data,error}=await sb.from('profiles').select('id,full_name,mobile,apartment,building,street,area,created_at').order('created_at',{ascending:false});if(error){$('customersTable').innerHTML='Unable to load customers.';return}$('customerCount').textContent=data?.length||0;if(!data?.length){$('customersTable').innerHTML='No customers yet.';return}let h='<table><thead><tr><th>Name</th><th>Mobile</th><th>Location</th><th>Registered</th></tr></thead><tbody>';for(const c of data){h+=`<tr><td>${esc(c.full_name||'—')}</td><td>${esc(c.mobile||'—')}</td><td>${esc([c.apartment,c.building,c.street,c.area].filter(Boolean).join(', ')||'—')}</td><td>${new Date(c.created_at).toLocaleDateString()}</td></tr>`}$('customersTable').innerHTML=h+'</tbody></table>'}async function loadOrders(){const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){$('ordersTable').innerHTML='Orders table is not available yet.';$('orderCount').textContent='0';return}$('orderCount').textContent=data?.length||0;if(!data?.length){$('ordersTable').innerHTML='No orders yet.';return}let h='<table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>';for(const o of data){h+=`<tr><td>${esc(o.id)}</td><td>${esc(o.customer_name||o.name||'—')}</td><td>AED ${Number(o.total||o.amount||0).toFixed(2)}</td><td><select onchange="changeOrderStatus('${esc(o.id)}',this.value)"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></td></tr>`}$('ordersTable').innerHTML=h+'</tbody></table>'}window.changeOrderStatus=async(id,status)=>{const{error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message)};$('refreshOrders').onclick=loadOrders;$('refreshCustomers').onclick=loadCustomers;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});$('loginBtn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}await loadAll()};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};loadAll();</script></body></html>
