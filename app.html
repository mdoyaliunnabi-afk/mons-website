<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS App | Install</title><meta name="theme-color" content="#6d4aff"><link rel="manifest" href="manifest.json"><style>body{font-family:Arial,sans-serif;background:#f6f7fb;color:#111827;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{max-width:520px;background:#fff;border-radius:28px;padding:34px;text-align:center;box-shadow:0 20px 60px #11182718}.logo{width:110px;height:110px;object-fit:contain}.btn{display:inline-block;border:0;border-radius:14px;padding:15px 22px;margin:8px;font-weight:900;text-decoration:none;cursor:pointer;background:#6d4aff;color:#fff}.btn.alt{background:#111827}.note{color:#687083;line-height:1.6}.hidden{display:none}</style></head><body><main class="box"><img class="logo" src="mons-logo.svg" alt="MONS"><h1>MONS App</h1><p class="note">Install MONS on your phone or computer for a faster app-like shopping experience.</p><button id="install" class="btn">📲 Install MONS App</button><a class="btn alt" href="index.html">🛍️ Open MONS Store</a><p id="help" class="note hidden">If Install does not appear, open the store in Chrome/Edge and use the browser menu → Install app / Add to Home Screen.</p></main><script>let deferred;const b=document.getElementById('install'),h=document.getElementById('help');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;b.style.display='inline-block'});b.addEventListener('click',async()=>{if(!deferred){h.classList.remove('hidden');return}deferred.prompt();await deferred.userChoice;deferred=null});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
