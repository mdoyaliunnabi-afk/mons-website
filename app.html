<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./mons-logo.svg"><title>MONS App | Install</title><style>body{margin:0;min-height:100vh;background:linear-gradient(135deg,#070707,#211b11);color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(520px,calc(100% - 20px));text-align:center;padding:38px 22px;border:1px solid #403a2d;border-radius:24px;background:#111;box-shadow:0 25px 80px #0009}.logo{width:190px;max-width:75%;margin-bottom:16px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:15px 22px;margin:8px;font-weight:900;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,#f5d27a,#b98938);color:#111}.btn.alt{background:#222;color:#fff;border:1px solid #555}.note{color:#aaa;line-height:1.6}.hidden{display:none}</style></head><body><main class="box"><img class="logo" src="./mons-main-logo.svg" alt="MONS"><h1>MONS App</h1><p class="note" id="status">Install MONS for an app-like shopping experience.</p><button id="install" class="btn">📲 INSTALL MONS APP</button><a class="btn alt" href="./index.html">🛍️ OPEN MONS STORE</a><p id="help" class="note hidden">Install is not offered by this browser yet. In Chrome/Edge, open the browser menu and choose “Install MONS” / “Install app”. On iPhone/iPad use Share → Add to Home Screen.</p></main><script>let deferred=null;const b=document.getElementById('install'),h=document.getElementById('help'),s=document.getElementById('status');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;s.textContent='MONS is ready to install.';b.disabled=false});b.addEventListener('click',async()=>{if(!deferred){h.classList.remove('hidden');return}deferred.prompt();await deferred.userChoice;deferred=null});window.addEventListener('appinstalled',()=>{s.textContent='MONS has been installed successfully.';b.style.display='none'});if(window.matchMedia('(display-mode: standalone)').matches){s.textContent='MONS is already running as an installed app.';b.style.display='none'}</script></body></html>
