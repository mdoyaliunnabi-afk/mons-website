<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS | Shop</title><style>:root{--p:#6c4cff;--pink:#ff3f9b;--blue:#00a8ff;--dark:#17122f;--muted:#697084;--line:#e7e1ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f7ff;color:var(--dark)}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:8px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:24px;font-weight:900;font-style:italic;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.navlinks a{padding:9px 10px;border-radius:10px;font-weight:800;color:#4d5565}.cart{background:var(--blue);color:#fff!important}.top-search{background:#fff;border-bottom:1px solid var(--line);padding:10px 15px;position:sticky;top:57px;z-index:15}.searchbox{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center;background:#f8f7ff;border:1px solid #dcd6f5;border-radius:13px;padding:5px 7px}.searchbox input{flex:1;border:0;background:transparent;outline:0;padding:9px;font-size:14px}.searchbox button{border:0;border-radius:9px;padding:9px 15px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;font-weight:900}.wrap{max-width:1200px;margin:auto;padding:34px 15px 55px}.heading h1{margin:0;font-size:38px;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent;display:inline-block}.heading p{color:var(--muted);margin:8px 0 22px}.count{color:var(--muted);font-size:14px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #6c4cff10}.pic{height:205px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}.pic img{width:100%;height:100%;object-fit:contain}.tag{display:block;margin-top:10px;font-size:10px;color:var(--pink);font-weight:900;text-transform:uppercase}.card h3{font-size:16px;line-height:1.25;margin:5px 0}.card p{font-size:12px;color:var(--muted);line-height:1.4;min-height:34px;margin:4px 0}.meta{font-size:11px;color:#778092;margin:7px 0}.price{font-weight:900;font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions button{border:0;border-radius:9px;padding:9px 5px;font-size:11px;font-weight:900;cursor:pointer}.view{background:#eeeaff;color:#5a42d6}.buy{background:linear-gradient(135deg,var(--p),var(--pink));color:#fff}.empty{text-align:center;background:#fff;border:1px dashed #cfc7ee;border-radius:16px;padding:40px;color:var(--muted);display:none}.modal{display:none;position:fixed;inset:0;background:#17122f99;z-index:100;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(520px,100%);background:#fff;border-radius:20px;padding:18px;position:relative}.modal-close{position:absolute;right:12px;top:10px;border:0;background:#f1effa;border-radius:50%;width:34px;height:34px;font-size:20px}.modal-img{width:100%;height:300px;object-fit:contain;border-radius:14px;background:#f8f7ff}.modal h2{margin:14px 0 6px}.modal-price{font-size:22px;font-weight:900;margin:8px 0}.modal-meta{color:var(--muted);font-size:13px}.modal-buy{width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;font-weight:900}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.navlinks{overflow-x:auto;flex-wrap:nowrap;max-width:72vw}.navlinks a{white-space:nowrap;font-size:10px;padding:8px 7px}.top-search{top:53px;padding:7px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:7px}.pic{height:155px}.card h3{font-size:14px}.actions button{font-size:9px}.modal{padding:10px}.modal-box{padding:12px}.modal-img{height:230px}}@media(max-width:480px){.pic{height:150px}.card h3{font-size:13px}}</style></head><body><header><div class="nav"><a class="logo" href="index.html">MONS</a><nav class="navlinks"><a href="index.html">Home</a><a href="filters.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="login.html">Login</a><a href="signup.html">Sign Up</a><a class="cart" href="cart.html">🛒 Cart</a></nav></div></header><div class="top-search"><form class="searchbox" id="searchForm"><span>🔎</span><input id="search" type="search" placeholder="Search MONS products..."><button>Search</button></form></div><main class="wrap"><div class="heading"><h1>Shop All Products</h1><p>Search any product name, including common names like headphones or earphones.</p></div><div class="count" id="count"></div><div class="grid" id="grid"></div><div class="empty" id="empty">😕 No products found.<br><b>Try another product name.</b></div></main><div class="modal" id="productModal" onclick="closeProduct(event)"><div class="modal-box" onclick="event.stopPropagation()"><button class="modal-close" onclick="hideProduct()">×</button><img class="modal-img" id="modalImg" alt=""><h2 id="modalName"></h2><div class="modal-price" id="modalPrice"></div><div class="modal-meta" id="modalMeta"></div><p>Quality MONS product for everyday use. Available for UAE shoppers.</p><button class="modal-buy" onclick="alert('Product added to cart!')">Add to Cart</button></div></div><script>
const base=[['Smart Watch Pro',79,'Electronics','MONS Tech'],['Wireless Earbuds',49,'Electronics','MONS Tech'],['LED Desk Lamp',39,'Home','MONS Home'],['Power Bank',59,'Electronics','MONS Tech'],['Phone Stand',29,'Accessories','MONS'],['Home Cleaning Kit',34,'Home','MONS Home'],['Insulated Travel Mug',42,'Home','MONS Active'],['Reusable Water Bottle',35,'Accessories','MONS Active'],['Travel Organizer Bag',45,'Accessories','MONS'],['Cordless Hand Vacuum',69,'Home','MONS Home'],['Wireless Keyboard',65,'Electronics','MONS Tech'],['Wireless Mouse',35,'Electronics','MONS Tech'],['Car Phone Holder',32,'Accessories','MONS'],['Fast USB Charger',45,'Electronics','MONS Tech'],['Multi Charging Cable',25,'Electronics','MONS Tech'],['Motion Sensor Night Light',29,'Home','MONS Home'],['Foldable Storage Box',38,'Home','MONS Home'],['Portable Neck Fan',59,'Electronics','MONS Active'],['Digital Kitchen Scale',33,'Home','MONS Home'],['Desk Organizer',31,'Accessories','MONS']];
const variants=['Classic','Pro','Plus','Max','Mini','Lite','Ultra','Air','Go','Flex','Prime','Edge','Smart','Compact','Premium','Essential','Modern','Active','Daily','Elite'];
const products=[];base.forEach((b,bi)=>variants.forEach((v,vi)=>{let n=b[0].replace(/ Pro$/,'');if(bi===0&&vi===0)n='Smart Watch Pro';else if(bi===1)n='Wireless Earbuds '+v;else n=n+' '+v;products.push({id:products.length,name:n,price:b[1]+((vi*3+bi*2)%25),cat:b[2],brand:b[3],rating:(4.2+((vi+bi)%7)/10).toFixed(1),stock:vi%9===0?'Low Stock':'In Stock',group:bi})}));
const images=['https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1609592424820-1c6a9a5b6f2d?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80'];
const aliases={'headphone':1,'headphones':1,'head phone':1,'earphone':1,'earphones':1,'earbud':1,'earbuds':1,'buds':1,'airpods':1,'smartwatch':0,'watch':0,'smart watch':0,'powerbank':3,'power bank':3,'charger':13,'usb charger':13,'phone holder':12,'car holder':12,'keyboard':10,'mouse':11,'desk lamp':2,'lamp':2,'water bottle':7,'bottle':7,'travel mug':6,'mug':6,'vacuum':9,'cleaning':5,'cleaning kit':5};
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function findGroup(q){const n=norm(q);if(aliases[n]!==undefined)return aliases[n];for(const k in aliases)if(n.includes(k)||k.includes(n))return aliases[k];for(let i=0;i<base.length;i++){const b=norm(base[i][0].replace(/ Pro$/,''));if(n.includes(b)||b.includes(n))return i}return -1}
function viewProduct(i){const p=products[i];document.getElementById('modalImg').src=images[p.group%images.length];document.getElementById('modalImg').alt=p.name;document.getElementById('modalName').textContent=p.name;document.getElementById('modalPrice').textContent='AED '+p.price;document.getElementById('modalMeta').textContent=p.brand+' · ⭐ '+p.rating+' · '+p.stock;document.getElementById('productModal').classList.add('show');document.body.style.overflow='hidden'}
function hideProduct(){document.getElementById('productModal').classList.remove('show');document.body.style.overflow=''}function closeProduct(e){if(e.target.id==='productModal')hideProduct()}
function render(){const q=document.getElementById('search').value.trim();let list;if(!q)list=products;else{const g=findGroup(q);list=g>=0?products.filter(p=>p.group===g):products.filter(p=>{const s=norm(p.name+' '+p.cat+' '+p.brand);return s.includes(norm(q))})}document.getElementById('count').textContent=q?'Showing '+list.length+' products for “'+q+'”':'Showing '+list.length+' products — 20 designs in each product type';document.getElementById('empty').style.display=list.length?'none':'block';document.getElementById('grid').innerHTML=list.map(p=>'<article class="card"><div class="pic" onclick="viewProduct('+p.id+')"><img src="'+images[p.group%images.length]+'" alt="'+p.name+'" loading="lazy"></div><span class="tag">'+p.brand+'</span><h3>'+p.name+'</h3><p>Quality MONS product for everyday use.</p><div class="meta">⭐ '+p.rating+' · '+p.stock+'</div><div class="price">AED '+p.price+'</div><div class="actions"><button class="view" onclick="viewProduct('+p.id+')">View Product</button><button class="buy" onclick="alert(\'Product added to cart!\')">Add to Cart</button></div></article>').join('')}
document.getElementById('search').addEventListener('input',render);document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideProduct()});const params=new URLSearchParams(location.search);document.getElementById('search').value=params.get('q')||'';render();</script></body></html>
