<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS | Shop</title><style>:root{--p:#6c4cff;--pink:#ff3f9b;--blue:#00a8ff;--dark:#17122f;--muted:#697084;--line:#e7e1ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8f7ff;color:var(--dark)}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:8px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:24px;font-weight:900;font-style:italic;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.navlinks a{padding:9px 10px;border-radius:10px;font-weight:800;color:#4d5565}.cart{background:var(--blue);color:#fff!important}.top-search{background:#fff;border-bottom:1px solid var(--line);padding:10px 15px;position:sticky;top:57px;z-index:15}.searchbox{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center;background:#f8f7ff;border:1px solid #dcd6f5;border-radius:13px;padding:5px 7px}.searchbox span{font-size:18px}.searchbox input{flex:1;border:0;background:transparent;outline:0;padding:9px;font-size:14px}.searchbox button{border:0;border-radius:9px;padding:9px 15px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;font-weight:900;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:34px 15px 55px}.heading h1{margin:0;font-size:38px;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent;display:inline-block}.heading p{color:var(--muted);margin:8px 0 22px}.count{color:var(--muted);font-size:14px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #6c4cff10;min-width:0}.pic{height:205px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}.pic img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}.tag{display:block;margin-top:10px;font-size:10px;color:var(--pink);font-weight:900;text-transform:uppercase;letter-spacing:1px}.card h3{font-size:16px;line-height:1.25;margin:5px 0}.card p{font-size:12px;color:var(--muted);line-height:1.4;min-height:34px;margin:4px 0}.meta{font-size:11px;color:#778092;margin:7px 0}.price{font-weight:900;font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions button{border:0;border-radius:9px;padding:9px 5px;font-size:11px;font-weight:900;cursor:pointer}.view{background:#eeeaff;color:#5a42d6}.buy{background:linear-gradient(135deg,var(--p),var(--pink));color:#fff}.empty{display:none;text-align:center;background:#fff;border:1px dashed #cfc7ee;border-radius:16px;padding:40px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#17122f99;z-index:100;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 60px #17122f55;position:relative}.modal-close{position:absolute;right:12px;top:10px;border:0;background:#f1effa;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.modal-img{width:100%;height:300px;object-fit:contain;border-radius:14px;background:#f8f7ff}.modal h2{margin:14px 0 6px}.modal-price{font-size:22px;font-weight:900;margin:8px 0;color:#17122f}.modal-meta{color:var(--muted);font-size:13px}.modal-buy{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;font-weight:900;cursor:pointer}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pic{height:190px}}@media(max-width:700px){.nav{padding:6px 8px}.navlinks{overflow-x:auto;flex-wrap:nowrap;max-width:72vw;scrollbar-width:none}.navlinks::-webkit-scrollbar{display:none}.navlinks a{white-space:nowrap;font-size:10px;padding:8px 7px}.top-search{top:53px;padding:7px 10px}.searchbox{padding:4px}.searchbox input{font-size:13px}.searchbox button{padding:8px 11px;font-size:11px}.wrap{padding:28px 10px 45px}.heading h1{font-size:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:7px;border-radius:14px}.pic{height:155px;padding:0;margin-bottom:7px}.pic img{width:100%;height:100%;object-fit:contain}.card h3{font-size:14px}.card p{font-size:11px;line-height:1.35;min-height:30px}.price{font-size:15px}.actions{gap:4px}.actions button{padding:8px 3px;font-size:9px}.modal{padding:10px}.modal-box{padding:12px}.modal-img{height:230px}}@media(max-width:480px){.grid{gap:7px}.card{padding:6px}.pic{height:150px}.pic img{width:100%;height:100%;object-fit:contain}.card h3{font-size:13px}.card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:14px}}</style></head><body><header><div class="nav"><a class="logo" href="index.html">MONS</a><nav class="navlinks"><a href="index.html">Home</a><a href="filters.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="login.html">Login</a><a href="signup.html">Sign Up</a><a class="cart" href="cart.html">🛒 Cart</a></nav></div></header><div class="top-search"><form class="searchbox" id="searchForm"><span>🔎</span><input id="search" type="search" placeholder="Search MONS products..."><button>Search</button></form></div><main class="wrap"><div class="heading"><h1>Shop All Products</h1><p>Search a product type to see 20 different MONS designs.</p></div><div class="count" id="count"></div><div class="grid" id="grid"></div><div class="empty" id="empty">😕 No products found.<br><b>Try another product name.</b></div></main><div class="modal" id="productModal" onclick="closeProduct(event)"><div class="modal-box" onclick="event.stopPropagation()"><button class="modal-close" onclick="hideProduct()">×</button><img class="modal-img" id="modalImg" src="" alt=""><h2 id="modalName"></h2><div class="modal-price" id="modalPrice"></div><div class="modal-meta" id="modalMeta"></div><p>Quality MONS product for everyday use. This product is currently available for UAE shoppers.</p><button class="modal-buy" onclick="alert('Product added to cart!')">Add to Cart</button></div></div><script>
const groups={
'Smart Watch':20,'Wireless Earbuds':20,'LED Desk Lamp':20,'Power Bank':20,'Phone Stand':20,'Home Cleaning Kit':20,'Insulated Travel Mug':20,'Reusable Water Bottle':20,'Travel Organizer Bag':20,'Cordless Hand Vacuum':20,'Wireless Keyboard':20,'Wireless Mouse':20,'Car Phone Holder':20,'Fast USB Charger':20,'Multi Charging Cable':20,'Motion Sensor Night Light':20,'Foldable Storage Box':20,'Portable Neck Fan':20,'Digital Kitchen Scale':20,'Desk Organizer':20};
const base=[['Smart Watch Pro',79,'Electronics','MONS Tech'],['Wireless Earbuds',49,'Electronics','MONS Tech'],['LED Desk Lamp',39,'Home','MONS Home'],['Power Bank',59,'Electronics','MONS Tech'],['Phone Stand',29,'Accessories','MONS'],['Home Cleaning Kit',34,'Home','MONS Home'],['Insulated Travel Mug',42,'Home','MONS Active'],['Reusable Water Bottle',35,'Accessories','MONS Active'],['Travel Organizer Bag',45,'Accessories','MONS'],['Cordless Hand Vacuum',69,'Home','MONS Home'],['Wireless Keyboard',65,'Electronics','MONS Tech'],['Wireless Mouse',35,'Electronics','MONS Tech'],['Car Phone Holder',32,'Accessories','MONS'],['Fast USB Charger',45,'Electronics','MONS Tech'],['Multi Charging Cable',25,'Electronics','MONS Tech'],['Motion Sensor Night Light',29,'Home','MONS Home'],['Foldable Storage Box',38,'Home','MONS Home'],['Portable Neck Fan',59,'Electronics','MONS Active'],['Digital Kitchen Scale',33,'Home','MONS Home'],['Desk Organizer',31,'Accessories','MONS']];
const variants=['Classic','Pro','Plus','Max','Mini','Lite','Ultra','Air','Go','Flex','Prime','Edge','Smart','Compact','Premium','Essential','Modern','Active','Daily','Elite'];
const products=[];base.forEach((b,bi)=>{variants.forEach((v,vi)=>{const name=bi===0&&vi===0?'Smart Watch Pro':`${b[0].replace(/ Pro$|s$/,'').replace(/Kit$/,'Kit')} ${v}`;const price=b[1]+((vi*3+bi*2)%25);products.push([name,price,b[2],b[3],4.2+((vi+bi)%7)/10,vi%9===0?'Low Stock':'In Stock',bi,vi])})});
const imagePool=['https://images.pexels.com/photos/2861929/pexels-photo-2861929.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1609592424820-1c6a9a5b6f2d?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1000&q=80'];
const imgs=products.map((p,i)=>imagePool[p[6]%imagePool.length]);const $=id=>document.getElementById(id);function render(){const q=$('search').value.trim().toLowerCase();let list=products.map((p,i)=>({p,i})).filter(x=>!q||x.p.slice(0,4).join(' ').toLowerCase().includes(q));if(q){const key=Object.keys(groups).find(k=>q.includes(k.toLowerCase())||k.toLowerCase().includes(q));if(key){const bi=base.findIndex(b=>b[0].toLowerCase().includes(key.toLowerCase().replace('smart watch','smart watch').replace('wireless earbuds','wireless earbuds')));if(bi>=0)list=products.map((p,i)=>({p,i})).filter(x=>x.p[6]===bi)}}$('count').textContent=q?`Showing ${list.length} products for “${q}”`:`Showing ${products.length} products — 20 designs in each product type`;$('empty').style.display=list.length?'none':'block';$('grid').innerHTML=list.map(x=>{const p=x.p;return `<article class="card"><div class="pic"><img src="${imgs[x.i]}" alt="${p[0]}" loading="lazy"></div><span class="tag">${p[3]}</span><h3>${p[0]}</h3><p>Quality MONS product for everyday use.</p><div class="meta">⭐ ${p[4].toFixed(1)} · ${p[5]}</div><div class="price">AED ${p[1]}</div><div class="actions"><button class="view" onclick="showProduct(${x.i})">View Product</button><button class="buy" onclick="alert('Product added to cart!')">Add to Cart</button></div></article>`}).join('')};function showProduct(i){const p=products[i];$('modalImg').src=imgs[i];$('modalImg').alt=p[0];$('modalName').textContent=p[0];$('modalPrice').textContent=`AED ${p[1]}`;$('modalMeta').textContent=`${p[3]} · ⭐ ${p[4].toFixed(1)} · ${p[5]}`;$('productModal').classList.add('show');document.body.style.overflow='hidden'}function hideProduct(){$('productModal').classList.remove('show');document.body.style.overflow=''}function closeProduct(e){if(e.target.id==='productModal')hideProduct()}$('search').addEventListener('input',render);$('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideProduct()});const params=new URLSearchParams(location.search);$('search').value=params.get('q')||'';render();</script></body></html>
