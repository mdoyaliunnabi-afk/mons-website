<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS | Search & Filters</title><style>
:root{--p:#6c4cff;--pink:#ff3f9b;--blue:#00a8ff;--dark:#17122f;--muted:#697084;--line:#e7e1ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8f7ff;color:var(--dark)}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:24px;font-weight:900;font-style:italic;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:7px;flex-wrap:wrap}.navlinks a{padding:9px 11px;border-radius:10px;font-weight:800;color:#4d5565}.cart{background:var(--blue);color:#fff!important}.top-search{max-width:1200px;margin:16px auto 0;padding:0 15px}.searchbox{display:flex;gap:8px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #6c4cff12}.searchbox input{flex:1;border:0;outline:0;padding:11px 12px;font-size:15px}.searchbox button{border:0;border-radius:11px;padding:11px 17px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;font-weight:900;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:25px 15px 55px}.heading h1{margin:0;font-size:38px;background:linear-gradient(90deg,var(--p),var(--pink),var(--blue));-webkit-background-clip:text;color:transparent}.heading p{color:var(--muted);margin:8px 0 20px}.filters{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 28px #6c4cff10;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #dcd6f5;border-radius:10px;background:#fff;outline:0}.filters .wide{grid-column:span 2}.actions{display:flex;gap:8px;margin-top:10px}.actions button{border:0;border-radius:10px;padding:10px 15px;font-weight:900;cursor:pointer}.clear{background:#252044;color:#fff}.count{color:var(--muted);font-size:14px;margin:17px 0 10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;box-shadow:0 8px 24px #6c4cff10}.pic{height:150px;border-radius:12px;background:#f4f3fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:58%;height:58%;object-fit:contain}.tag{display:block;margin-top:10px;font-size:10px;color:var(--pink);font-weight:900;text-transform:uppercase;letter-spacing:1px}.card h3{font-size:16px;margin:5px 0}.card p{font-size:12px;color:var(--muted);line-height:1.4;min-height:34px;margin:4px 0}.meta{font-size:11px;color:#778092;margin:7px 0}.price{font-weight:900;font-size:17px}.empty{display:none;text-align:center;background:#fff;border:1px dashed #cfc7ee;border-radius:16px;padding:40px;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.navlinks{overflow-x:auto;flex-wrap:nowrap}.navlinks a{font-size:11px;padding:8px}.heading h1{font-size:30px}.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:span 2}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:110px}.pic img{width:48%;height:48%}}@media(max-width:480px){.filters{grid-template-columns:1fr}.filters .wide{grid-column:auto}.searchbox{padding:6px}.searchbox button{padding:10px 12px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:8px}.pic{height:95px}.card h3{font-size:13px}.card p{font-size:10px}.price{font-size:14px}}
</style></head><body><header><div class="nav"><a class="logo" href="index.html">MONS</a><nav class="navlinks"><a href="index.html">Home</a><a href="filters.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="login.html">Login</a><a href="signup.html">Sign Up</a><a class="cart" href="cart.html">🛒 Cart</a></nav></div></header>
<div class="top-search"><form class="searchbox" id="searchForm"><span style="font-size:19px;padding:8px 2px">🔎</span><input id="search" type="search" placeholder="Search products..."><button>Search</button></form></div>
<main class="wrap"><div class="heading"><h1>Search & Filter</h1><p>Find exactly what you want from the MONS collection.</p></div>
<div class="filters"><input id="min" type="number" min="0" placeholder="Min price (AED)"><input id="max" type="number" min="0" placeholder="Max price (AED)"><select id="category"><option value="">All Categories</option><option>Electronics</option><option>Home</option><option>Accessories</option></select><select id="brand"><option value="">All Brands</option><option>MONS</option><option>MONS Tech</option><option>MONS Home</option><option>MONS Active</option></select><select id="rating"><option value="">Any Rating</option><option value="4.5">4.5★ & up</option><option value="4">4★ & up</option><option value="3">3★ & up</option></select><select id="stock"><option value="">All Availability</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select><select id="color"><option value="">All Colors</option><option>Black</option><option>Blue</option><option>Pink</option><option>Green</option><option>White</option></select><select id="size"><option value="">All Sizes</option><option>Small</option><option>Medium</option><option>Large</option><option>One Size</option></select></div><div class="actions"><button class="clear" id="clear">Clear Filters</button></div>
<div class="count" id="count"></div><div class="grid" id="grid"></div><div class="empty" id="empty">😕 No products found.<br><b>Try changing your search or filters.</b></div></main>
<script>
const imgs=['https://www.pejesmart.com/cdn/shop/files/Z159-_01_2dc19610-9aec-4829-ae2a-9b8998eabd3b.jpg?v=1726221899&width=1500','https://livedoor.blogimg.jp/itlifehack/imgs/7/1/71ed74f8.jpg','https://media.adeo.com/mkp/e25d975970559614d1981ef094b95871/media.jpeg?fit=bounds&format=jpg&height=650&quality=80&width=650','https://storage.ctinews.com/compression/files/default/cut-1777100799-KybZWpP.png','https://www.creationsglf.fr/globalflexit/images/img_base/boutique_article/3229/1920_1080_1_ngbu683-02.jpg','https://www.takfajn.sk/Media/EcommerceUpload/Category/shutterstock_1909.jpg','https://www.netzsieger.de/mdx/category/3293/thermobecher1d9fd.jpg','https://images.unsplash.com/photo-1623684194967-48075185a58c?fm=jpg&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cmV1c2FibGUlMjB3YXRlciUyMGJvdHRsZXxlbnwwfHwwfHx8MA%3D%3D&ixlib=rb-4.1.0&q=60&w=1200','https://storage.googleapis.com/fga-public/2023/05/99f744f1-ana66502942_e-zeze.jpg','https://images.casativo.ch/images/product_images/popup_images/ch8248_1.jpg','https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1600086827875-a63b01f1335c?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80','https://images.unsplash.com/photo-1584464491033-06628f3a6b7b?auto=format&fit=crop&w=1200&q=80'];
const products=[
['Smart Watch Pro',79,'Electronics','MONS Tech','Black','One Size',4.8,'In Stock'],['Wireless Earbuds',49,'Electronics','MONS Tech','White','One Size',4.6,'In Stock'],['LED Desk Lamp',39,'Home','MONS Home','Blue','Medium',4.4,'In Stock'],['Power Bank',59,'Electronics','MONS Tech','Black','One Size',4.7,'Low Stock'],['Phone Stand',29,'Accessories','MONS','Green','One Size',4.2,'In Stock'],['Home Cleaning Kit',34,'Home','MONS Home','Green','Large',4.3,'In Stock'],['Insulated Travel Mug',42,'Home','MONS Active','Black','Medium',4.5,'In Stock'],['Reusable Water Bottle',35,'Accessories','MONS Active','Blue','Large',4.6,'In Stock'],['Travel Organizer Bag',45,'Accessories','MONS','Pink','Large',4.4,'Low Stock'],['Cordless Hand Vacuum',69,'Home','MONS Home','White','One Size',4.7,'In Stock'],['Wireless Keyboard',65,'Electronics','MONS Tech','Black','One Size',4.6,'In Stock'],['Wireless Mouse',35,'Electronics','MONS Tech','Black','One Size',4.5,'In Stock'],['Car Phone Holder',32,'Accessories','MONS','Black','One Size',4.3,'In Stock'],['Fast USB Charger',45,'Electronics','MONS Tech','White','One Size',4.7,'In Stock'],['Multi Charging Cable',25,'Electronics','MONS Tech','White','One Size',4.4,'In Stock'],['Motion Sensor Night Light',29,'Home','MONS Home','White','Small',4.5,'In Stock'],['Foldable Storage Box',38,'Home','MONS Home','Blue','Large',4.3,'In Stock'],['Portable Neck Fan',59,'Electronics','MONS Active','Pink','One Size',4.6,'Low Stock'],['Digital Kitchen Scale',33,'Home','MONS Home','White','One Size',4.4,'In Stock'],['Desk Organizer',31,'Accessories','MONS','Green','Medium',4.2,'In Stock']
];
const $=id=>document.getElementById(id);function render(){const q=$('search').value.trim().toLowerCase(),mi=+$('min').value||0,ma=+$('max').value||Infinity,cat=$('category').value,brand=$('brand').value,rat=+$('rating').value||0,stock=$('stock').value,color=$('color').value,size=$('size').value;const list=products.map((p,i)=>({...{name:p[0],price:p[1],cat:p[2],brand:p[3],color:p[4],size:p[5],rating:p[6],stock:p[7]},i})).filter(p=>(!q||p.name.toLowerCase().includes(q))&&p.price>=mi&&p.price<=ma&&(!cat||p.cat===cat)&&(!brand||p.brand===brand)&&p.rating>=rat&&(!stock||p.stock===stock)&&(!color||p.color===color)&&(!size||p.size===size));$('count').textContent=`Showing ${list.length} of ${products.length} products`;$('empty').style.display=list.length?'none':'block';$('grid').innerHTML=list.map(p=>`<article class="card"><div class="pic"><img src="${imgs[p.i]}" alt="${p.name}" loading="lazy"></div><span class="tag">${p.cat}</span><h3>${p.name}</h3><p>Quality MONS product for everyday use.</p><div class="meta">⭐ ${p.rating} · ${p.stock}</div><div class="price">AED ${p.price}</div></article>`).join('')};['search','min','max','category','brand','rating','stock','color','size'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});$('clear').onclick=()=>{['search','min','max','category','brand','rating','stock','color','size'].forEach(id=>$(id).value='');render()};const params=new URLSearchParams(location.search);$('search').value=params.get('q')||'';render();
</script></body></html>
