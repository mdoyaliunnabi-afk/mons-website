<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | MONS</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0d1020,#4b35a8);min-height:100vh;color:#15172b;position:relative}body:before{content:"";position:fixed;inset:0;background:url('mons-logo.svg') center/420px no-repeat;opacity:.06;filter:blur(1.5px);pointer-events:none;z-index:0}.wrap{max-width:900px;margin:auto;padding:30px 20px;position:relative;z-index:1}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900;font-style:italic;color:white;text-decoration:none}.home{color:white;text-decoration:none;font-weight:700}.card{max-width:430px;margin:70px auto;background:white;border-radius:25px;padding:35px;box-shadow:0 25px 70px #0005}.card h1{margin:0 0 8px;font-size:36px}.card p{color:#687083}.field{margin-top:18px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #dddfea;border-radius:11px;box-sizing:border-box;font-size:15px}.btn{width:100%;border:0;margin-top:22px;padding:14px;border-radius:12px;background:#6d4aff;color:white;font-size:16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.note{font-size:13px;text-align:center;margin-top:18px;color:#7a8190}.note a{color:#6d4aff;font-weight:800}.msg{display:none;margin-top:16px;padding:12px;border-radius:10px;text-align:center;font-size:14px}.ok{background:#effff4;color:#168342}.err{background:#fff1f1;color:#b42318}.links{text-align:center;margin-top:18px}.links a{color:#6d4aff;font-weight:800;text-decoration:none}@media(max-width:600px){body:before{background-size:280px}}</style></head><body><div class="wrap"><div class="nav"><a class="logo" href="index.html">MONS</a><a class="home" href="index.html">Home</a></div><div class="card"><h1>Welcome back</h1><p>Login to your MONS account.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••" required></div><button class="btn" id="loginBtn" type="submit">Login →</button></form><div class="msg ok" id="ok"></div><div class="msg err" id="err"></div><div class="links"><a href="signup.html">Create a MONS account</a></div><div class="note">Your account is protected by MONS secure authentication.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const supabaseClient=window.supabase.createClient(window.MONS_SUPABASE_URL,window.MONS_SUPABASE_KEY);const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),ok=document.getElementById('ok'),err=document.getElementById('err');form.addEventListener('submit',async e=>{e.preventDefault();ok.style.display='none';err.style.display='none';btn.disabled=true;btn.textContent='Logging in...';const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});btn.disabled=false;btn.textContent='Login →';if(error){err.textContent=error.message;err.style.display='block';return}ok.textContent='Login successful! Welcome to MONS.';ok.style.display='block';setTimeout(()=>location.href='index.html',900)});</script></body></html>
