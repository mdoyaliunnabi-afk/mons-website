<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS | Product Details</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8f7ff;color:#17122f}header{padding:12px 18px;background:#fff;border-bottom:1px solid #e7e1ff;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900;font-style:italic;color:#6c4cff}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.back{display:inline-block;margin-bottom:18px;color:#6c4cff;font-weight:800}.product{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:#fff;padding:20px;border-radius:22px;border:1px solid #e7e1ff;box-shadow:0 8px 30px #ddd8f5}.photo{height:500px;background:#f8f7ff;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.tag{color:#ff3f9b;font-size:12px;font-weight:900;text-transform:uppercase}.title{font-size:38px;line-height:1.15;margin:8px 0}.rating{margin:10px 0;font-weight:700}.price{font-size:30px;font-weight:900;margin:18px 0}.old{font-size:15px;color:#999;text-decoration:line-through;margin-left:8px}.desc{color:#697084;line-height:1.75;font-size:16px}.details{margin-top:22px;border-top:1px solid #eee;padding-top:12px}.details div{padding:10px 0;color:#555;border-bottom:1px solid #f1f1f1}.features{margin-top:22px}.features h2{font-size:20px}.features ul{padding-left:20px;color:#555;line-height:1.8}.buy{margin-top:18px;width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#6c4cff,#ff3f9b);color:white;font-weight:900;font-size:15px;cursor:pointer}.cartmsg{display:none;margin-top:12px;padding:10px;border-radius:10px;background:#eefbf3;color:#17834b;font-weight:700}.more{margin-top:22px;background:#fff;padding:22px;border-radius:20px;border:1px solid #e7e1ff}.more h2{margin-top:0}.more p{color:#697084;line-height:1.7}@media(max-width:700px){.product{grid-template-columns:1fr;padding:12px}.photo{height:330px}.title{font-size:28px}.wrap{padding:20px 10px}.price{font-size:25px}}</style></head><body><header><a class="logo" href="index.html">MONS</a></header><main class="wrap"><a class="back" href="filters.html">← Back to Products</a><section class="product"><div class="photo"><img id="img" alt="Product"></div><div><div class="tag" id="brand"></div><h1 class="title" id="name"></h1><div class="rating" id="rating"></div><div class="price" id="price"></div><p class="desc" id="desc"></p><div class="details"><div><b>Category:</b> <span id="cat"></span></div><div><b>Availability:</b> <span id="stock"></span></div><div><b>Brand:</b> <span id="brand2"></span></div><div><b>Product Code:</b> <span id="code"></span></div><div><b>Delivery:</b> UAE delivery available</div><div><b>Return:</b> Easy return support</div></div><div class="features"><h2>Key Features</h2><ul id="features"></ul></div><button class="buy" onclick="addCart()">Add to Cart</button><div class="cartmsg" id="cartmsg">✓ Product added to cart</div></div></section><section class="more"><h2>Product Information</h2><p id="longdesc"></p></section></main><script>const data=JSON.parse(localStorage.getItem('monsSelectedProduct')||'null');function addCart(){document.getElementById('cartmsg').style.display='block';localStorage.setItem('monsCartProduct',JSON.stringify(data))}if(!data){location.href='filters.html'}else{const name=data.name||'MONS Product';document.getElementById('img').src=data.image;document.getElementById('name').textContent=name;document.getElementById('brand').textContent=data.brand||'MONS';document.getElementById('brand2').textContent=data.brand||'MONS';document.getElementById('price').textContent='AED '+data.price;document.getElementById('rating').textContent='⭐ '+data.rating+' · '+(data.stock||'In Stock');document.getElementById('cat').textContent=data.cat||'Everyday Essentials';document.getElementById('stock').textContent=data.stock||'In Stock';document.getElementById('code').textContent='MONS-'+String(data.id||'000000').slice(-6).toUpperCase();const desc=data.description||('The '+name+' is designed for everyday use with a practical, modern style. It is a convenient choice for UAE shoppers looking for useful products and dependable daily performance.');document.getElementById('desc').textContent=desc;document.getElementById('longdesc').textContent=desc+' This product is selected for the MONS collection with a focus on usability, simple design and everyday convenience. Please check the product information above before ordering.';const list=['Modern and practical design','Suitable for everyday use','Easy to use and carry','Designed for convenient daily shopping'];document.getElementById('features').innerHTML=list.map(x=>'<li>'+x+'</li>').join('')}</script></body></html>
