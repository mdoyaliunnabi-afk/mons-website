const id=new URLSearchParams(location.search).get('id');const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const i=products.findIndex(p=>slug(p[0])===id);const app=document.getElementById('app');let qty=1,selectedColor='Black';

function galleryHtml(prefix){const views=[`${prefix}1`,`${prefix}2`,`${prefix}3`,`${prefix}4`,`${prefix}1`];return `<div class="gallery-main" id="galleryMain">${art(views[0])}</div><div class="thumbs">${views.map((v,n)=>`<button class="thumb ${n===0?'active':''}" onclick="showImage(${n})" aria-label="View ${n+1}">${art(v,n===4)}</button>`).join('')}</div>`}

if(i<0){app.innerHTML='<div class="error"><h2>Product not found</h2><a href="index.html">Return to shop</a></div>'}else{const p=products[i];document.title=p[0]+' | MONS';const family=p[0].replace(/\s+(Pro|Active|Classic)$/i,'').trim();const baseIndex=i%20;const related=Array.from({length:20},(_,n)=>({name:n===0?p[0]:family+' '+['Pro','Plus','Max','Ultra','Air','Lite','Prime','X','S','Go','Mini','Flex','Elite','Active','Classic','Advanced','2026','Edition','Premium'][n-1],price:p[4]+((n%5)*5),prefix:families[baseIndex]}));app.innerHTML=`<section class="product"><div>${galleryHtml(families[i%20])}</div><div><div class="tag">${p[3]}</div><h1 class="title">${p[0]}</h1><div class="price">AED ${p[4]}</div><p class="desc">${p[1]} This product is selected for the MONS collection with a focus on practical everyday use, modern design and convenient shopping.</p><div class="details"><div><b>Category:</b> ${p[2]}</div><div><b>Availability:</b> In Stock</div><div><b>Brand:</b> ${p[3]}</div><div><b>Delivery:</b> UAE delivery available</div></div><div class="option"><label>Color</label><div class="colors"><button class="color active" onclick="chooseColor(this,'Black')">Black</button><button class="color" onclick="chooseColor(this,'White')">White</button><button class="color" onclick="chooseColor(this,'Blue')">Blue</button></div></div><div class="option"><label>Quantity</label><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qty">1</span><button onclick="changeQty(1)">+</button></div></div><div class="actions"><button class="cart" onclick="addCart()">Add to Cart</button><button class="buy" onclick="buyNow()">Buy Now</button></div><div class="msg" id="msg">✓ Product added to cart</div></div></section><section class="info"><h2>Product Description</h2><p>${p[1]} This product is selected for the MONS collection with a focus on practical everyday use, modern design and convenient shopping. It is suitable for customers looking for useful products at a simple, affordable price. Please review the product images, color, quantity, category and availability before placing your order.</p></section><section class="related"><h2>More ${family} Products</h2><div class="grid">${related.map((x,n)=>`<article class="card"><a href="product.html?id=${slug(p[0])}">${art(x.prefix+((n%4)+1),n%5===4)}<div class="card-body"><div class="card-title">${x.name}</div><div class="card-price">AED ${x.price}</div></div></a></article>`).join('')}</div></section>`}
