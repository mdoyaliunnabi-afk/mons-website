const images=['https://www.pejesmart.com/cdn/shop/files/Z159-_01_2dc19610-9aec-4829-ae2a-9b8998eabd3b.jpg?v=1726221899&width=1500','https://livedoor.blogimg.jp/itlifehack/imgs/7/1/71ed74f8.jpg','https://media.adeo.com/mkp/e25d975970559614d1981ef094b95871/media.jpeg?fit=bounds&format=jpg&height=650&quality=80&width=650','https://storage.ctinews.com/compression/files/default/cut-1777100799-KybZWpP.png','https://www.creationsglf.fr/globalflexit/images/img_base/boutique_article/3229/1920_1080_1_ngbu683-02.jpg','https://www.takfajn.sk/Media/EcommerceUpload/Category/shutterstock_1909.jpg','https://www.netzsieger.de/mdx/category/3293/thermobecher1d9fd.jpg','https://images.unsplash.com/photo-1623684194967-48075185a58c?auto=format&fit=crop&w=900&q=80','https://storage.googleapis.com/fga-public/2023/05/99f744f1-ana66502942_e-zeze.jpg','https://images.casativo.ch/images/product_images/popup_images/ch8248_1.jpg','https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1600086827875-a63b01f1335c?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1495474472287-4d71bcdd2087?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1584464491033-06628f3a6b7b?auto=format&fit=crop&w=900&q=80'];
const products=[['Smart Watch Pro','Smartwatch for fitness, calls and notifications.','Electronics','MONS Tech',79],['Wireless Earbuds','Compact wireless earbuds for music and calls.','Electronics','MONS Tech',49],['LED Desk Lamp','Modern adjustable lamp for desk and bedside use.','Home','MONS Home',39],['Power Bank','Portable power for phones and everyday travel.','Electronics','MONS Tech',59],['Phone Stand','Adjustable stand for phones, calls and videos.','Accessories','MONS',29],['Home Cleaning Kit','Practical cleaning essentials for everyday use.','Home','MONS Home',45],['Wireless Keyboard','Slim keyboard for laptops, tablets and desks.','Electronics','MONS Tech',65],['Wireless Mouse','Comfortable wireless mouse for office and study.','Electronics','MONS Tech',35],['Car Phone Holder','Adjustable holder for navigation and calls.','Auto','MONS Drive',32],['Fast USB Charger','Compact wall charger for compatible devices.','Electronics','MONS Tech',45],['Multi Charging Cable','Multi-connector cable for everyday devices.','Accessories','MONS',25],['Motion Sensor Night Light','Motion-sensor light for rooms and hallways.','Home','MONS Home',29],['Foldable Storage Box','Storage box for clothes, toys and household items.','Home','MONS Home',38],['Portable Neck Fan','Hands-free portable fan for travel and outdoors.','Lifestyle','MONS Air',59],['Digital Kitchen Scale','Compact scale for cooking and baking.','Kitchen','MONS Home',33],['Desk Organizer','Multi-compartment organizer for stationery and gadgets.','Office','MONS',31],['Reusable Water Bottle','Modern reusable bottle for work, gym and travel.','Lifestyle','MONS Life',35],['Travel Mug','Insulated travel mug for coffee and tea.','Kitchen','MONS Home',42],['USB Desk Fan','Compact USB fan for desk and study spaces.','Home','MONS Air',37],['Laptop Sleeve','Protective slim sleeve for everyday laptop carry.','Accessories','MONS',55]];
const id=new URLSearchParams(location.search).get('id');const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const i=products.findIndex(p=>slug(p[0])===id);const app=document.getElementById('app');let qty=1,selectedColor='Black';if(i<0){app.innerHTML='<div class="error"><h2>Product not found</h2><a href="index.html">Return to shop</a></div>'}else{const p=products[i];document.title=p[0]+' | MONS';const related=products.map((x,n)=>`<article class="card"><a href="product.html?id=${slug(x[0])}"><img src="${images[n]}" alt="${x[0]}"><div class="card-body"><div class="card-title">${x[0]}</div><div class="card-price">AED ${x[4]}</div></div></a></article>`).join('');app.innerHTML=`<section class="product"><div class="photo"><img src="${images[i]}" alt="${p[0]}"></div><div><div class="tag">${p[3]}</div><h1 class="title">${p[0]}</h1><div class="price">AED ${p[4]}</div><p class="desc">${p[1]}</p><div class="details"><div><b>Category:</b> ${p[2]}</div><div><b>Availability:</b> In Stock</div><div><b>Brand:</b> ${p[3]}</div><div><b>Delivery:</b> UAE delivery available</div></div><div class="option"><label>Color</label><div class="colors"><button class="color active" onclick="chooseColor(this,'Black')">Black</button><button class="color" onclick="chooseColor(this,'White')">White</button><button class="color" onclick="chooseColor(this,'Blue')">Blue</button></div></div><div class="option"><label>Quantity</label><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qty">1</span><button onclick="changeQty(1)">+</button></div></div><div class="actions"><button class="cart" onclick="addCart()">Add to Cart</button><button class="buy" onclick="buyNow()">Buy Now</button></div><div class="msg" id="msg">✓ Product added to cart</div></div></section><section class="info"><h2>Product Description</h2><p>${p[1]} This product is selected for the MONS collection with a focus on practical everyday use, modern design and convenient shopping. It is suitable for function chooseColor(el,c){selectedColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function changeQty(n){qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty}function addCart(){if(i<0)return;let c=JSON.parse(localStorage.getItem('monsCart')||'[]');for(let x=0;x<qty;x++)c.push({name:products[i][0],price:products[i][4],image:images[i],color:selectedColor});localStorage.setItem('monsCart',JSON.stringify(c));document.getElementById('msg').textContent='✓ '+qty+' product added to cart';document.getElementById('msg').style.display='block'}function buyNow(){addCart();location.href='cart.html'}
</script></body></html>
