<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS | Product Details</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8f7ff;color:#17122f}header{padding:12px 18px;background:#fff;border-bottom:1px solid #e7e1ff;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900;font-style:italic;color:#6c4cff}.wrap{max-width:1050px;margin:auto;padding:35px 16px}.back{display:inline-block;margin-bottom:18px;color:#6c4cff;font-weight:800}.product{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;padding:20px;border-radius:22px;border:1px solid #e7e1ff}.photo{height:480px;background:#f8f7ff;border-radius:18px;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.tag{color:#ff3f9b;font-size:12px;font-weight:900;text-transform:uppercase}.title{font-size:38px;margin:8px 0}.price{font-size:28px;font-weight:900;margin:18px 0}.rating{margin:10px 0}.desc{color:#697084;line-height:1.7;font-size:16px}.details{margin-top:22px;border-top:1px solid #eee;padding-top:15px}.details div{padding:9px 0;color:#555}.buy{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6c4cff,#ff3f9b);color:white;font-weight:900;font-size:15px;cursor:pointer}@media(max-width:700px){.product{grid-template-columns:1fr;padding:12px}.photo{height:330px}.title{font-size:28px}.wrap{padding:20px 10px}}</style></head><body><header><a class="logo" href="index.html">MONS</a></header><main class="wrap"><a class="back" href="filters.html">← Back to Products</a><section class="product"><div class="photo"><img id="img" alt="Product"></div><div><div class="tag" id="brand"></div><h1 class="title" id="name"></h1><div class="rating" id="rating"></div><div class="price" id="price"></div><p class="desc" id="desc"></p><div class="details"><div><b>Category:</b> <span id="cat"></span></div><div><b>Availability:</b> <span id="stock"></span></div><div><b>Brand:</b> <span id="brand2"></span></div></div><button class="buy" onclick="alert('Product added to cart!')">Add to Cart</button></div></section></main><script>const data=JSON.parse(localStorage.getItem('monsSelectedProduct')||'null');if(!data){location.href='filters.html'}else{document.getElementById('img').src=data.image;document.getElementById('name').textContent=data.name;document.getElementById('brand').textContent=data.brand;document.getElementById('brand2').textContent=data.brand;document.getElementById('price').textContent='AED '+data.price;document.getElementById('rating').textContent='⭐ '+data.rating+' · '+data.stock;document.getElementById('cat').textContent=data.cat;document.getElementById('stock').textContent=data.stock;document.getElementById('desc').textContent=data.description||('High-quality '+data.name+' designed for everyday use. A practical MONS choice for UAE shoppers, with a modern design and reliable everyday performance.');}</script></body></html>
