<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Profile | MONS</title><style>:root{--gold:#f5d27a;--gold2:#b98a38;--bg:#080808;--card:#121212;--line:#2b2b2b;--muted:#aaa}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#080808,#211a0d);min-height:100vh;color:#fff}.wrap{width:min(1000px,100%);margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.logo{font-size:30px;font-weight:950;font-style:italic;color:var(--gold);text-decoration:none}.home{color:#ddd;text-decoration:none;font-weight:800;font-size:13px}.card{background:rgba(18,18,18,.96);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0009}.head{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:24px}.avatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f5d27a,#9b6f22);color:#111;font-size:27px;font-weight:950}.head h1{margin:0 0 6px;font-size:28px}.head p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.box{border:1px solid var(--line);border-radius:14px;padding:17px;background:#0d0d0d}.box span{display:block;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.box b{display:block;font-size:14px;word-break:break-word}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:#111}.dark{background:#202020;color:#fff;border:1px solid #444}.msg{text-align:center;color:#aaa;padding:40px 10px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:14px 10px 35px}.card{padding:20px;border-radius:18px}.grid{grid-template-columns:1fr}.head h1{font-size:23px}.avatar{width:58px;height:58px;font-size:22px}}
</style></head><body><div class="wrap"><div class="top"><a class="logo" href="index.html">MONS</a><a class="home" href="index.html">← Store</a></div><div class="card"><div id="loading" class="msg">Loading your MONS profile…</div><div id="guest" class="msg hidden"><h2>Please log in</h2><p>Your profile is available after you sign in to your MONS account.</p><div class="actions" style="justify-content:center"><a class="btn gold" href="login.html">Login</a><a class="btn dark" href="signup.html">Create account</a></div></div><div id="profile" class="hidden"><div class="head"><div class="avatar" id="avatar">M</div><div><h1 id="name">MONS Customer</h1><p id="email"></p></div></div><div class="grid"><div class="box"><span>Full Name</span><b id="fullName">—</b></div><div class="box"><span>Email</span><b id="email2">—</b></div><div class="box"><span>Mobile</span><b id="mobile">—</b></div><div class="box"><span>Apartment / Villa</span><b id="apartment">—</b></div><div class="box"><span>Building / Tower</span><b id="building">—</b></div><div class="box"><span>Street / Road</span><b id="street">—</b></div><div class="box"><span>Area / City</span><b id="area">—</b></div><div class="box"><span>Additional Details</span><b id="details">—</b></div></div><div class="actions"><a class="btn gold" href="cart.html">View Cart</a><a class="btn dark" href="index.html#products">Continue Shopping</a><button class="btn dark" id="logout" type="button">Log out</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=window.supabase.createClient(window.MONS_SUPABASE_URL,window.MONS_SUPABASE_KEY);const $=id=>document.getElementById(id);async function init(){try{const {data,error}=await sb.auth.getUser();$('loading').classList.add('hidden');if(error||!data.user){$('guest').classList.remove('hidden');return}const u=data.user,m=u.user_metadata||{},name=m.full_name||'MONS Customer';$('profile').classList.remove('hidden');$('name').textContent=name;$('email').textContent=u.email||'';$('fullName').textContent=name;$('email2').textContent=u.email||'—';$('mobile').textContent=m.mobile||'—';$('apartment').textContent=m.apartment||'—';$('building').textContent=m.building||'—';$('street').textContent=m.street||'—';$('area').textContent=m.area||'—';$('details').textContent=m.details||'—';$('avatar').textContent=name.trim().charAt(0).toUpperCase()||'M'}catch(e){$('loading').classList.add('hidden');$('guest').classList.remove('hidden')}}$('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});init();</script></body></html>
