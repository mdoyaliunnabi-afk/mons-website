<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | MONS</title><style>:root{--p:#6d4aff;--ink:#111827;--muted:#687083;--line:#e8eaf0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0d1020,#33216e);min-height:100vh;color:var(--ink);display:grid;place-items:center;padding:20px}.box{width:min(480px,100%);background:#fff;border-radius:26px;padding:32px;box-shadow:0 30px 90px #0006}.brand{text-align:center}.brand img{width:82px;height:82px}.brand h1{font-size:30px;font-style:italic;margin-top:4px}.brand p{color:var(--muted);margin:6px 0 25px}.form label{display:block;font-weight:800;margin:12px 0 6px}.form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none}.form input:focus{border-color:var(--p);box-shadow:0 0 0 3px #6d4aff18}.section{font-size:14px;font-weight:900;color:var(--p);margin-top:20px;padding-bottom:5px;border-bottom:1px solid var(--line)}.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.back{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}.back a{color:var(--p);font-weight:900;text-decoration:none}.notice,.error{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;text-align:center}.notice{background:#effff4;color:#168342}.error{background:#fff1f1;color:#b42318}.demo{text-align:center;color:#9aa0ad;font-size:11px;margin-top:18px}</style></head><body><div class="box"><div class="brand"><img src="mons-logo.svg" alt="MONS"><h1>MONS</h1><p>Create your account</p></div><form class="form" id="signupForm"><label>Full Name</label><input id="name" type="text" placeholder="Enter your full name" required><label>Email Address</label><input id="email" type="email" placeholder="you@example.com" required><label>Mobile Number</label><input id="mobile" type="tel" placeholder="05XXXXXXXX" required><div class="section">📍 Delivery Location</div><label>Apartment / Villa No.</label><input id="apartment" type="text" placeholder="Apartment / Villa No." required><label>Building / Tower Name</label><input id="building" type="text" placeholder="Building / Tower Name" required><label>Street / Road</label><input id="street" type="text" placeholder="Street / Road" required><label>Area / City</label><input id="area" type="text" placeholder="Area / City, UAE" required><label>Additional Location Details</label><input id="details" type="text" placeholder="Floor, landmark, etc. (optional)"><label>Password</label><input id="password" type="password" placeholder="Create a password" minlength="6" required><label>Confirm Password</label><input id="confirm" type="password" placeholder="Confirm your password" minlength="6" required><button class="btn" id="submitBtn" type="submit">Create Account</button></form><div class="notice" id="notice"></div><div class="error" id="error"></div><div class="back">Already have an account? <a href="login.html">Login</a></div><div class="back"><a href="index.html">← Back to MONS Store</a></div><div class="demo">MONS secure customer account system</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const supabaseClient=window.supabase.createClient(window.MONS_SUPABASE_URL,window.MONS_SUPABASE_KEY);const form=document.getElementById('signupForm'),btn=document.getElementById('submitBtn'),notice=document.getElementById('notice'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();notice.style.display='none';error.style.display='none';const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){error.textContent='Passwords do not match.';error.style.display='block';return}btn.disabled=true;btn.textContent='Creating account...';const {data,error:signUpError}=await supabaseClient.auth.signUp({email:document.getElementById('email').value.trim(),password,options:{data:{full_name:document.getElementById('name').value.trim(),mobile:document.getElementById('mobile').value.trim(),apartment:document.getElementById('apartment').value.trim(),building:document.getElementById('building').value.trim(),street:document.getElementById('street').value.trim(),area:document.getElementById('area').value.trim(),details:document.getElementById('details').value.trim()},emailRedirectTo:window.location.origin+window.location.pathname.replace('signup.html','login.html')}});btn.disabled=false;btn.textContent='Create Account';if(signUpError){error.textContent=signUpError.message;error.style.display='block';return}if(data.session){notice.textContent='Account created successfully! You can now use your MONS account.';notice.style.display='block';setTimeout(()=>location.href='index.html',1200)}else{notice.textContent='Account created! Please check your email to confirm your account, then login.';notice.style.display='block';form.reset()}});</script></body></html>
