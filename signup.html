<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | MONS</title><style>:root{--p:#6d4aff;--ink:#111827;--muted:#687083;--line:#e8eaf0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0d1020,#33216e);min-height:100vh;color:var(--ink);display:grid;place-items:center;padding:20px}.box{width:min(480px,100%);background:#fff;border-radius:26px;padding:32px;box-shadow:0 30px 90px #0006}.brand{text-align:center}.brand img{width:82px;height:82px}.brand h1{font-size:30px;font-style:italic;margin-top:4px}.brand p{color:var(--muted);margin:6px 0 25px}.form label{display:block;font-weight:800;margin:12px 0 6px}.form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none}.form input:focus{border-color:var(--p);box-shadow:0 0 0 3px #6d4aff18}.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.back{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}.back a{color:var(--p);font-weight:900;text-decoration:none}.notice{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#effff4;color:#168342;font-size:14px;text-align:center}.demo{text-align:center;color:#9aa0ad;font-size:11px;margin-top:18px}</style></head><body><div class="box"><div class="brand"><img src="mons-logo.svg" alt="MONS"><h1>MONS</h1><p>Create your account</p></div><form class="form" id="signupForm"><label>Full Name</label><input id="name" type="text" placeholder="Enter your full name" required><label>Email Address</label><input id="email" type="email" placeholder="you@example.com" required><label>Mobile Number</label><input id="mobile" type="tel" placeholder="05XXXXXXXX" required><label>Password</label><input id="password" type="password" placeholder="Create a password" minlength="6" required><label>Confirm Password</label><input id="confirm" type="password" placeholder="Confirm your password" minlength="6" required><button class="btn" type="submit">Create Account</button></form><div class="notice" id="notice">Account details accepted for this demo. Real account login is not connected yet.</div><div class="back">Already have an account? <a href="login.html">Login</a></div><div class="back"><a href="index.html">← Back to MONS Store</a></div><div class="demo">MONS demo website — secure real account system will require a backend.</div></div><script>document.getElementById('signupForm').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('password').value!==document.getElementById('confirm').value){alert('Passwords do not match.');return}document.getElementById('notice').style.display='block';this.reset()});</script></body></html>
