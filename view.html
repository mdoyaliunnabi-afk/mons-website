<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Product</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f7f4ed,#fff,#f4f0e7);color:#191919}header{background:rgba(7,7,7,.97);padding:13px 20px;position:sticky;top:0;z-index:5;border-bottom:1px solid #292929}.head{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo img{width:150px;display:block}.cart{color:#fff;text-decoration:none;font-size:12px;font-weight:900;border:1px solid #555;border-radius:99px;padding:10px 15px}.wrap{max-width:1150px;margin:auto;padding:24px 15px}.back{color:#8d6d32;font-weight:900;text-decoration:none}.product{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;border:1px solid #e3ddd0;border-radius:24px;padding:20px;box-shadow:0 15px 45px #5b4a2a16}.main{height:470px;border-radius:18px;background:#f6f3eb;display:flex;align-items:center;justify-content:center;overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}.tag{display:inline-block;color:#8d6d32;font-weight:900;font-size:11px;text-transform:uppercase;margin-top:8px}.title{font-size:40px;line-height:1.1;margin:9px 0}.price{font-size:30px;font-weight:950;color:#8d6d32;margin:18px 0}.desc{color:#626262;line-height:1.7}.info{margin-top:18px;border-top:1px solid #eee;padding-top:14px;line-height:2}.qty{display:flex;width:max-content;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-top:8px}.qty button{width:44px;height:42px;border:0;background:#f2eee5;font-size:20px;cursor:pointer}.qty span{width:52px;display:grid;place-items:center;font-weight:900}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;border-radius:12px;padding:15px;font-weight:950;cursor:pointer}.cart-btn{background:#eee9df;color:#3d3221}.buy{background:linear-gradient(135deg,#f0c76a,#b98a36);color:#111}.msg{display:none;margin-top:12px;padding:11px;background:#eafbf1;color:#16834b;border-radius:10px;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.thumb{height:85px;border:2px solid transparent;border-radius:11px;background:#f6f3eb;overflow:hidden;cursor:pointer}.thumb.active{border-color:#b58b3d}.thumb img{width:100%;height:100%;object-fit:contain}@media(max-width:700px){.head{padding:0 4px}.logo img{width:125px}.product{grid-template-columns:1fr;padding:12px}.main{height:330px}.title{font-size:28px}.gallery{grid-template-columns:repeat(4,1fr)}.thumb{height:65px}.actions{flex-direction:column}}</style></head><body><header><div class="head"><a class="logo" href="index.html"><img src="mons-main-logo.svg" alt="MONS"></a><a class="cart" href="cart.html">Cart</a></div></header><main class="wrap"><a class="back" href="index.html">← Back to Products</a><div id="app">Loading...</div></main><script src="catalog-v2.js"></script><script>const id=Number(new URLSearchParams(location.search).get('id')),p=window.MONS_PRODUCTS.find(x=>Number(x.id)===id),app=document.getElementById('app');let qty=1;if(!p){app.innerHTML='<div style="padding:70px;text-align:center"><h2>Product not found</h2><a href="index.html">Return to MONS</a></div>'}else{document.title=p.name+' | MONS';const imgs=p.gallery&&p.gallery.length?p.gallery:[p.image];app.innerHTML=`<section class="product"><div><div class="main"><img id="mainImg" src="${p.image}" alt="${p.name}" onerror="this.onerror=null;this.src='https://loremflickr.com/700/700/${encodeURIComponent(p.name)}?lock=${p.id+7000}'"></div><div class="gallery">${imgs.slice(0,4).map((x,i)=>`<button class="thumb ${i===0?'active':''}" type="button" onclick="showImg(${i})"><img src="${x}" alt="${p.name}" onerror="this.onerror=null;this.src='https://loremflickr.com/300/300/${encodeURIComponent(p.name)}?lock=${p.id+8000+i}'"></button>`).join('')}</div></div><div><span class="tag">${p.brand} · ${p.category}</span><h1 class="title">${p.name}</h1><div class="price">AED ${Number(p.price).toFixed(2)}</div><p class="desc">${p.description}</p><div class="info"><b>Category:</b> ${p.category}<br><b>Brand:</b> ${p.brand}<br><b>Availability:</b> ${p.stock}<br><b>Delivery:</b> UAE delivery available</div><div style="margin-top:18px"><b>Quantity</b><div class="qty"><button type="button" onclick="change(-1)">−</button><span id="qty">1</span><button type="button" onclick="change(1)">+</button></div></div><div class="actions"><button class="cart-btn" type="button" onclick="add(false)">Add to Cart</button><button class="buy" type="button" onclick="add(true)">Buy Now</button></div><div id="msg" class="msg">✓ Added to cart</div></div></section>`}function showImg(i){document.getElementById('mainImg').src=p.gallery[i];document.querySelectorAll('.thumb').forEach((x,n)=>x.classList.toggle('active',n===i))}function change(n){qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty}function add(buy){let c=JSON.parse(localStorage.getItem('monsCart')||'[]'),x=c.find(a=>String(a.id)===String(p.id));if(x)x.qty=Number(x.qty||1)+qty;else c.push({id:p.id,name:p.name,price:Number(p.price),image:p.image,qty});localStorage.setItem('monsCart',JSON.stringify(c));document.getElementById('msg').style.display='block';if(buy)setTimeout(()=>location.href='cart.html',150)}</script></body></html>
