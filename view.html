<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Product</title><style>body{margin:0;font-family:Arial;background:#f7f7f7;color:#171717;position:relative}body:before{content:"MONS";position:fixed;inset:0;display:grid;place-items:center;font-size:180px;font-weight:900;font-style:italic;opacity:.035;pointer-events:none;z-index:0}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;position:sticky;top:0;z-index:5}.logo{font-size:28px;font-weight:900;font-style:italic;color:#111;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:22px 14px;position:relative;z-index:1}.back{display:inline-block;margin-bottom:15px;color:#111;font-weight:800;text-decoration:none}.product{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;padding:18px;border-radius:22px;border:1px solid #ddd}.main{height:470px;border-radius:18px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}.thumb{height:80px;border:2px solid transparent;border-radius:11px;background:#f1f1f1;overflow:hidden;cursor:pointer}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:contain}.tag{color:#666;font-weight:900;text-transform:uppercase;font-size:12px}.title{font-size:38px;margin:7px 0}.price{font-size:30px;font-weight:900;margin:15px 0}.desc{color:#555;line-height:1.7}.description-box{margin-top:18px;padding:18px;border:1px solid #ddd;border-radius:14px;background:#fafafa}.description-box h2{margin:0 0 10px;font-size:20px}.info{margin-top:18px;padding-top:14px;border-top:1px solid #eee}.qty{display:flex;align-items:center;width:max-content;border:1px solid #ddd;border-radius:10px;overflow:hidden}.qty button{width:42px;height:42px;border:0;background:#eee;font-size:20px}.qty span{width:50px;text-align:center;font-weight:900}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer}.cart{background:#eee;color:#111}.buy{background:#111;color:#fff}.msg{display:none;margin-top:10px;background:#e9f7ed;color:#176b32;padding:10px;border-radius:10px}@media(max-width:700px){.product{grid-template-columns:1fr}.main{height:330px}.title{font-size:28px}.thumb{height:60px}body:before{font-size:90px}}</style></head><body><header><a class="logo" href="index.html">MONS</a></header><main class="wrap"><a class="back" href="index.html">← Back to Products</a><div id="app">Loading product...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(MONS_SUPABASE_URL,MONS_SUPABASE_KEY),id=new URLSearchParams(location.search).get('id');let product,qty=1,gallery=[];const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function getGallery(p){let g=[];if(Array.isArray(p.gallery))g=p.gallery;if(typeof p.gallery==='string'){try{const v=JSON.parse(p.gallery);if(Array.isArray(v))g=v}catch(e){g=p.gallery.split(/\s*,\s*|\s*\n\s*/).filter(Boolean)}}['image2','image_2','image2_url','image_2_url','image3','image_3','image3_url','image_3_url','image4','image_4','image4_url','image_4_url','image5','image_5','image5_url','image_5_url'].forEach(k=>{if(p[k]&&typeof p[k]==='string')g.push(p[k])});g.unshift(p.image||'');return [...new Set(g.filter(Boolean))].slice(0,5)}function fallbackDescription(p){return p.description&&String(p.description).trim()?String(p.description).trim():`Discover the ${p.name||'MONS product'}, selected by MONS for everyday use in the UAE. Designed to be practical, reliable and easy to use, with a clean modern style. Please check the product information, stock status and images before ordering.`}async function load(){let q=db.from('products').select('*');if(id&&/^\d+$/.test(id))q=q.eq('id',Number(id));else q=q.ilike('name',decodeURIComponent(id||'').replace(/-/g,' '));const r=await q.maybeSingle();if(r.error||!r.data){app.innerHTML='<div style="text-align:center;padding:70px">Product not found.<br><br><a href="index.html">Back to store</a></div>';return}product=r.data;gallery=getGallery(product);while(gallery.length<5)gallery.push(gallery[gallery.length-1]||'');render()}function render(){const description=fallbackDescription(product);app.innerHTML=`<div class="product"><div><div class="main"><img id="mainImg" src="${esc(gallery[0])}" alt="${esc(product.name)}"></div><div class="thumbs">${gallery.map((x,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showImg(${i})"><img src="${esc(x)}" alt="${esc(product.name)} image ${i+1}"></button>`).join('')}</div></div><div><div class="tag">${esc(product.brand||'MONS')} · ${esc(product.category||'')}</div><h1 class="title">${esc(product.name)}</h1><div class="price">AED ${Number(product.price||0).toFixed(2)}</div><div class="description-box"><h2>Product Description</h2><p class="desc">${esc(description)}</p></div><div class="info"><b>Stock:</b> ${esc(product.stock||'In Stock')}<br><br><b>UAE delivery:</b> Available</div><div style="margin-top:18px"><b>Quantity</b><div class="qty"><button onclick="change(-1)">−</button><span id="qty">1</span><button onclick="change(1)">+</button></div></div><div class="actions"><button class="cart" onclick="add(false)">Add to Cart</button><button class="buy" onclick="add(true)">Buy Now</button></div><div id="msg" class="msg">Added to cart!</div></div></div>`}window.showImg=i=>{document.getElementById('mainImg').src=gallery[i];document.querySelectorAll('.thumb').forEach((b,n)=>b.classList.toggle('active',n===i))};window.change=n=>{qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty};window.add=buy=>{let c=JSON.parse(localStorage.getItem('monsCart')||'[]');const old=c.find(x=>String(x.id)===String(product.id));if(old){old.qty=Number(old.qty||1)+qty;old.price=Number(product.price);old.image=product.image}else c.push({id:product.id,name:product.name,price:Number(product.price),image:product.image,qty});localStorage.setItem('monsCart',JSON.stringify(c));document.getElementById('msg').style.display='block';if(buy)setTimeout(()=>location.href='cart.html',250)};load();</script></body></html>
