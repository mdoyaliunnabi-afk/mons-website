<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Product</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#f7f4ff,#fff,#effaff);color:#19152d}header{background:#fff;padding:15px 20px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5ddff}.logo{font-size:28px;font-weight:950;font-style:italic;background:linear-gradient(90deg,#6c4cff,#ff3f9b,#00b8ff);-webkit-background-clip:text;color:transparent;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:24px 15px}.back{color:#6c4cff;font-weight:900;text-decoration:none}.product{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;border:1px solid #e6ddff;border-radius:24px;padding:20px;box-shadow:0 15px 45px #5b45aa18}.main{height:470px;border-radius:18px;background:#f6f5fb;display:flex;align-items:center;justify-content:center;overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}.tag{display:inline-block;color:#6c4cff;font-weight:900;font-size:11px;text-transform:uppercase;margin-top:8px}.title{font-size:40px;line-height:1.1;margin:9px 0}.price{font-size:30px;font-weight:950;color:#6c4cff;margin:18px 0}.desc{color:#626278;line-height:1.7}.info{margin-top:18px;border-top:1px solid #eee;padding-top:14px;line-height:2}.qty{display:flex;width:max-content;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-top:8px}.qty button{width:44px;height:42px;border:0;background:#f0edff;font-size:20px;cursor:pointer}.qty span{width:52px;display:grid;place-items:center;font-weight:900}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;border-radius:12px;padding:15px;font-weight:950;cursor:pointer}.cart{background:#eeeaff;color:#4f38c5}.buy{background:linear-gradient(135deg,#6c4cff,#ff3f9b);color:#fff}.msg{display:none;margin-top:12px;padding:11px;background:#eafbf1;color:#16834b;border-radius:10px;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.thumb{height:85px;border:2px solid transparent;border-radius:11px;background:#f6f5fb;overflow:hidden;cursor:pointer}.thumb.active{border-color:#6c4cff}.thumb img{width:100%;height:100%;object-fit:contain}@media(max-width:700px){.product{grid-template-columns:1fr;padding:12px}.main{height:330px}.title{font-size:28px}.gallery{grid-template-columns:repeat(4,1fr)}.thumb{height:65px}.actions{flex-direction:column}}</style></head><body><header><a class="logo" href="index.html">MONS</a></header><main class="wrap"><a class="back" href="index.html">← Back to Products</a><div id="app">Loading...</div></main><script src="catalog-v2.js"></script><script>const id=Number(new URLSearchParams(location.search).get('id')),p=window.MONS_PRODUCTS.find(x=>Number(x.id)===id),app=document.getElementById('app');let qty=1;if(!p){app.innerHTML='<div style="padding:70px;text-align:center"><h2>Product not found</h2><a href="index.html">Return to MONS</a></div>'}else{document.title=p.name+' | MONS';const imgs=p.gallery||[p.image];app.innerHTML=`<section class="product"><div><div class="main"><img id="mainImg" src="${p.image}" alt="${p.name}"></div><div class="gallery">${imgs.slice(0,4).map((x,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showImg(${i})"><img src="${x}" alt="${p.name}"></button>`).join('')}</div></div><div><span class="tag">${p.brand} · ${p.category}</span><h1 class="title">${p.name}</h1><div class="price">AED ${Number(p.price).toFixed(2)}</div><p class="desc">${p.description}</p><div class="info"><b>Category:</b> ${p.category}<br><b>Brand:</b> ${p.brand}<br><b>Availability:</b> ${p.stock}<br><b>Delivery:</b> UAE delivery available</div><div style="margin-top:18px"><b>Quantity</b><div class="qty"><button onclick="change(-1)">−</button><span id="qty">1</span><button onclick="change(1)">+</button></div></div><div class="actions"><button class="cart" onclick="add(false)">Add to Cart</button><button class="buy" onclick="add(true)">Buy Now</button></div><div id="msg" class="msg">✓ Added to cart</div></div></section>`}function showImg(i){document.getElementById('mainImg').src=p.gallery[i];document.querySelectorAll('.thumb').forEach((x,n)=>x.classList.toggle('active',n===i))}function change(n){qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty}function add(buy){let c=JSON.parse(localStorage.getItem('monsCart')||'[]'),x=c.find(a=>String(a.id)===String(p.id));if(x)x.qty=Number(x.qty||1)+qty;else c.push({id:p.id,name:p.name,price:Number(p.price),image:p.image,qty});localStorage.setItem('monsCart',JSON.stringify(c));document.getElementById('msg').style.display='block';if(buy)setTimeout(()=>location.href='cart.html',150)}</script></body></html>
