<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONS Product</title><style>body{margin:0;font-family:Arial;background:#f8f7ff;color:#17122f}header{background:#fff;border-bottom:1px solid #e7e1ff;padding:14px 18px;position:sticky;top:0;z-index:5}.logo{font-size:28px;font-weight:900;font-style:italic;color:#6c4cff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:22px 14px}.back{display:inline-block;margin-bottom:15px;color:#6c4cff;font-weight:800;text-decoration:none}.product{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;padding:18px;border-radius:22px;border:1px solid #e7e1ff}.main{height:470px;border-radius:18px;background:#f4f2fb;display:flex;align-items:center;justify-content:center;overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:9px}.thumb{height:80px;border:2px solid transparent;border-radius:11px;background:#f4f2fb;overflow:hidden;cursor:pointer}.thumb.active{border-color:#6c4cff}.thumb img{width:100%;height:100%;object-fit:contain}.tag{color:#ff3f9b;font-weight:900;text-transform:uppercase;font-size:12px}.title{font-size:38px;margin:7px 0}.price{font-size:30px;font-weight:900;margin:15px 0}.desc{color:#697084;line-height:1.7}.info{margin-top:18px;padding-top:14px;border-top:1px solid #eee}.qty{display:flex;align-items:center;width:max-content;border:1px solid #ddd;border-radius:10px;overflow:hidden}.qty button{width:42px;height:42px;border:0;background:#eeeaff;font-size:20px}.qty span{width:50px;text-align:center;font-weight:900}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer}.cart{background:#eeeaff;color:#4f38c5}.buy{background:linear-gradient(135deg,#6c4cff,#ff3f9b);color:#fff}.msg{display:none;margin-top:10px;background:#edfff5;color:#168342;padding:10px;border-radius:10px}@media(max-width:700px){.product{grid-template-columns:1fr}.main{height:330px}.title{font-size:28px}.thumb{height:60px}}</style></head><body><header><a class="logo" href="index.html">MONS</a></header><main class="wrap"><a class="back" href="index.html">← Back to Products</a><div id="app">Loading product...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(MONS_SUPABASE_URL,MONS_SUPABASE_KEY),id=new URLSearchParams(location.search).get('id');let product,qty=1;const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){let q=db.from('products').select('*');if(id&&/^\d+$/.test(id))q=q.eq('id',Number(id));else q=q.ilike('name',decodeURIComponent(id||'').replace(/-/g,' '));const r=await q.maybeSingle();if(r.error||!r.data){app.innerHTML='<div style="text-align:center;padding:70px">Product not found.<br><br><a href="index.html">Back to store</a></div>';return}product=r.data;render()}function render(){const img=product.image||'';const imgs=[img,img,img,img,img];app.innerHTML=`<div class="product"><div><div class="main"><img id="mainImg" src="${esc(img)}" alt="${esc(product.name)}"></div><div class="thumbs">${imgs.map((x,i)=>`<button class="thumb ${i===0?'active':''}" onclick="showImg(${i})"><img src="${esc(x)}" alt=""></button>`).join('')}</div></div><div><div class="tag">${esc(product.brand||'MONS')} · ${esc(product.category||'')}</div><h1 class="title">${esc(product.name)}</h1><div class="price">AED ${Number(product.price||0).toFixed(2)}</div><p class="desc">${esc(product.description||'')}</p><div class="info"><b>Stock:</b> ${esc(product.stock||'In Stock')}<br><br><b>UAE delivery:</b> Available</div><div style="margin-top:18px"><b>Quantity</b><div class="qty"><button onclick="change(-1)">−</button><span id="qty">1</span><button onclick="change(1)">+</button></div></div><div class="actions"><button class="cart" onclick="add(false)">Add to Cart</button><button class="buy" onclick="add(true)">Buy Now</button></div><div id="msg" class="msg">Added to cart!</div></div></div>`}window.showImg=()=>{document.getElementById('mainImg').src=product.image||''};window.change=n=>{qty=Math.max(1,qty+n);document.getElementById('qty').textContent=qty};window.add=buy=>{let c=JSON.parse(localStorage.getItem('monsCart')||'[]');for(let i=0;i<qty;i++)c.push({id:product.id,name:product.name,price:Number(product.price),image:product.image});localStorage.setItem('monsCart',JSON.stringify(c));document.getElementById('msg').style.display='block';if(buy)setTimeout(()=>location.href='cart.html',250)};load();</script></body></html>
